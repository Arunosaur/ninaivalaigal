# Development Docker Compose Configuration
# Usage: docker-compose -f docker/docker-compose.dev.yml up

services:
  # ============================================================================
  # GraphOps Rust Service
  # ============================================================================
  graphops:
    build:
      context: ..
      dockerfile: docker/templates/rust-service.Dockerfile
    container_name: graphops-service
    ports:
      - "50051:50051"  # gRPC
      - "9090:9090"    # Prometheus metrics
    environment:
      DATABASE_URL: postgresql://nina:${DB_PASSWORD:-dev_password}@postgres:5432/ninaivalaigal_dev
      RUST_LOG: ${RUST_LOG:-info}
      GRAPHOPS_GRPC_ADDR: 0.0.0.0:50051
      GRAPHOPS_METRICS_ADDR: 0.0.0.0:9090
      GRAPH_NAME: ninaivalaigal_intelligence
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ninaivalaigal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/graphops-service", "--health-check"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============================================================================
  # Core API Microservice (Authentication, Users, Teams, Organizations)
  # Extracted from monolithic server for SPEC-100 Stage 3
  # ============================================================================
  core-api:
    build:
      context: ..
      dockerfile: services/core-api/Dockerfile
    container_name: ninaivalaigal-core-api
    ports:
      - "8001:8000"  # External 8001, internal 8000
    environment:
      # Database connection (via PgBouncer for connection pooling)
      NINA_ENV: dev
      NINA_DB_USER: nina
      NINA_DB_PASSWORD: ${DB_PASSWORD:-dev_password}
      DATABASE_URL: postgresql://nina:${DB_PASSWORD:-dev_password}@pgbouncer:5432/ninaivalaigal_dev
      
      # JWT Authentication
      NINAIVALAIGAL_JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      NINA_JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: 168
      
      # Service configuration
      PORT: 8000
      ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
      # Redis (for future session management)
      REDIS_URL: redis://redis:6379/0
    volumes:
      # Mount code for hot-reload in development
      - ../services/core-api:/app
      - ../shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - ninaivalaigal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: nina
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
      POSTGRES_DB: ninaivalaigal_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../server/database/schemas:/docker-entrypoint-initdb.d
    networks:
      - ninaivalaigal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nina -d ninaivalaigal_dev"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Redis Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ninaivalaigal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    command: redis-server --appendonly yes

  # ============================================================================
  # PgBouncer (Connection Pooler)
  # ============================================================================
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    environment:
      DATABASE_URL: postgresql://nina:${DB_PASSWORD:-dev_password}@postgres:5432/ninaivalaigal_dev
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ninaivalaigal
    restart: unless-stopped

  # ============================================================================
  # Prometheus (Metrics Collection)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - ninaivalaigal
    restart: unless-stopped

  # ============================================================================
  # Grafana (Metrics Visualization)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - ninaivalaigal
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  ninaivalaigal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
