# Development Docker Compose Configuration
# Usage: docker-compose -f docker/docker-compose.dev.yml up

services:
  # ============================================================================
  # GraphOps Rust Service
  # ============================================================================
  graphops:
    build:
      context: ..
      dockerfile: docker/templates/rust-service.Dockerfile
    container_name: ninaivalaigal-dev-graphops
    ports:
      - "50051:50051"  # gRPC
      - "9090:9090"    # Prometheus metrics
    environment:
      DATABASE_URL: postgresql://nina:${DB_PASSWORD:-dev_password}@postgres:5432/ninaivalaigal_dev
      RUST_LOG: ${RUST_LOG:-info}
      GRAPHOPS_GRPC_ADDR: 0.0.0.0:50051
      GRAPHOPS_METRICS_ADDR: 0.0.0.0:9090
      GRAPH_NAME: ninaivalaigal_intelligence
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ninaivalaigal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/graphops-service", "--health-check"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============================================================================
  # Core API Microservice (Authentication, Users, Teams, Organizations)
  # Extracted from monolithic server for SPEC-100 Stage 3
  # ============================================================================
  core-api:
    build:
      context: ..
      dockerfile: services/core-api/Dockerfile
    container_name: ninaivalaigal-dev-core-api
    ports:
      - "8001:8000"  # External 8001, internal 8000
    environment:
      # Database connection (via PgBouncer for connection pooling)
      NINA_ENV: dev
      NINA_DB_USER: nina
      NINA_DB_PASSWORD: ${DB_PASSWORD:-dev_password}
      DATABASE_URL: postgresql://nina:${DB_PASSWORD:-dev_password}@pgbouncer:5432/ninaivalaigal_dev

      # JWT Authentication
      NINAIVALAIGAL_JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      NINA_JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: 168

      # Service configuration
      PORT: 8000
      ENV: dev  # SPEC-107: Used by gunicorn.conf.py for worker count and reload
      ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Redis (for future session management)
      REDIS_URL: redis://redis:6379/0
    volumes:
      # Mount code for hot-reload in development
      - ../services/core-api:/app
      - ../shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - ninaivalaigal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: ninaivalaigal-dev-db
    environment:
      POSTGRES_USER: nina
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
      POSTGRES_DB: ninaivalaigal_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../server/database/schemas:/docker-entrypoint-initdb.d
    networks:
      - ninaivalaigal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nina -d ninaivalaigal_dev"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Redis Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ninaivalaigal-dev-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ninaivalaigal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    command: redis-server --appendonly yes

  # ============================================================================
  # PgBouncer (Connection Pooler)
  # ============================================================================
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: ninaivalaigal-dev-pgbouncer
    environment:
      DATABASE_URL: postgresql://nina:${DB_PASSWORD:-dev_password}@postgres:5432/ninaivalaigal_dev
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ninaivalaigal
    restart: unless-stopped

  # ============================================================================
  # Prometheus (Metrics Collection)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ninaivalaigal-dev-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - ninaivalaigal
    restart: unless-stopped

  # ============================================================================
  # Grafana (Metrics Visualization)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: ninaivalaigal-dev-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ../config/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
      - loki
    networks:
      - ninaivalaigal
    restart: unless-stopped

  # ============================================================================
  # Grafana Loki (Log Aggregation)
  # ============================================================================
  loki:
    image: grafana/loki:2.9.3
    container_name: ninaivalaigal-dev-loki
    ports:
      - "3100:3100"  # Port per ports.nv.yaml (docker/dev)
    volumes:
      - ../monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ninaivalaigal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Promtail (Log Collection Agent)
  # ============================================================================
  promtail:
    image: grafana/promtail:2.9.3
    container_name: ninaivalaigal-dev-promtail
    ports:
      - "9080:9080"  # Port per ports.nv.yaml (docker/dev)
    volumes:
      - ../monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - ninaivalaigal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9080/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: ninaivalaigal-dev-db-data
    driver: local
  redis_data:
    name: ninaivalaigal-dev-redis-data
    driver: local
  prometheus_data:
    name: ninaivalaigal-dev-prometheus-data
    driver: local
  grafana_data:
    name: ninaivalaigal-dev-grafana-data
    driver: local
  loki_data:
    name: ninaivalaigal-dev-loki-data
    driver: local

networks:
  ninaivalaigal:
    driver: bridge
    name: dev-ninaivalaigal-net
    ipam:
      config:
        - subnet: 172.25.0.0/16
