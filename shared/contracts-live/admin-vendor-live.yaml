components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthResponse:
      description: Health check response model
      properties:
        service:
          title: Service
          type: string
        status:
          title: Status
          type: string
        timestamp:
          title: Timestamp
          type: string
        uptime_seconds:
          title: Uptime Seconds
          type: number
        version:
          title: Version
          type: string
      required:
      - status
      - service
      - version
      - uptime_seconds
      - timestamp
      title: HealthResponse
      type: object
    PasswordResetRequest:
      description: Password reset request
      properties:
        current_password:
          title: Current Password
          type: string
        new_password:
          title: New Password
          type: string
      required:
      - current_password
      - new_password
      title: PasswordResetRequest
      type: object
    RateLimitConfig:
      description: RateLimitConfig class.
      properties:
        api_calls_per_minute:
          title: Api Calls Per Minute
          type: integer
        memory_operations_per_hour:
          title: Memory Operations Per Hour
          type: integer
        storage_limit_gb:
          title: Storage Limit Gb
          type: number
        tenant_id:
          title: Tenant Id
          type: string
        user_limit:
          title: User Limit
          type: integer
      required:
      - tenant_id
      - api_calls_per_minute
      - memory_operations_per_hour
      - storage_limit_gb
      - user_limit
      title: RateLimitConfig
      type: object
    ReadinessResponse:
      description: Readiness check response model
      properties:
        dependencies:
          title: Dependencies
          type: object
        service:
          title: Service
          type: string
        status:
          title: Status
          type: string
        timestamp:
          title: Timestamp
          type: string
        version:
          title: Version
          type: string
      required:
      - status
      - service
      - version
      - dependencies
      - timestamp
      title: ReadinessResponse
      type: object
    StaffActivityResponse:
      description: Response model for staff activity
      properties:
        action:
          title: Action
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        details:
          anyOf:
          - type: object
          - type: 'null'
          title: Details
        ip_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip Address
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
        resource_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Type
      required:
      - action
      - resource_type
      - resource_id
      - details
      - ip_address
      - created_at
      title: StaffActivityResponse
      type: object
    StaffCreate:
      description: Request model for creating sta
      properties:
        department:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          title: Department
        email:
          format: email
          title: Email
          type: string
        name:
          maxLength: 255
          minLength: 2
          title: Name
          type: string
        phone:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          title: Phone
        role:
          pattern: ^(support|ops|analyst|admin)$
          title: Role
          type: string
      required:
      - name
      - email
      - role
      title: StaffCreate
      type: object
    StaffCreateResponse:
      description: Response after creating sta
      properties:
        expires_at:
          format: date-time
          title: Expires At
          type: string
        message:
          title: Message
          type: string
        staff_id:
          format: uuid
          title: Staff Id
          type: string
        temporary_password:
          title: Temporary Password
          type: string
      required:
      - staff_id
      - temporary_password
      - expires_at
      - message
      title: StaffCreateResponse
      type: object
    StaffDeactivate:
      description: Request model for deactivating sta
      properties:
        reason:
          maxLength: 500
          minLength: 10
          title: Reason
          type: string
      required:
      - reason
      title: StaffDeactivate
      type: object
    StaffLoginRequest:
      description: Staff login request
      properties:
        email:
          format: email
          title: Email
          type: string
        password:
          title: Password
          type: string
      required:
      - email
      - password
      title: StaffLoginRequest
      type: object
    StaffLoginResponse:
      description: Staff login response
      properties:
        access_token:
          title: Access Token
          type: string
        name:
          title: Name
          type: string
        permissions:
          items:
            type: string
          title: Permissions
          type: array
        requires_password_reset:
          title: Requires Password Reset
          type: boolean
        role:
          title: Role
          type: string
        staff_id:
          title: Staff Id
          type: string
        token_type:
          default: bearer
          title: Token Type
          type: string
      required:
      - access_token
      - role
      - permissions
      - requires_password_reset
      - staff_id
      - name
      title: StaffLoginResponse
      type: object
    StaffResponse:
      description: Response model for staff data
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        department:
          anyOf:
          - type: string
          - type: 'null'
          title: Department
        email:
          title: Email
          type: string
        id:
          format: uuid
          title: Id
          type: string
        is_active:
          title: Is Active
          type: boolean
        last_login:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Login
        name:
          title: Name
          type: string
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        role:
          title: Role
          type: string
      required:
      - id
      - name
      - email
      - role
      - department
      - phone
      - is_active
      - created_at
      - last_login
      title: StaffResponse
      type: object
    StaffRoleUpdate:
      description: Request model for updating staff role
      properties:
        reason:
          maxLength: 500
          minLength: 10
          title: Reason
          type: string
        role:
          pattern: ^(support|ops|analyst|admin)$
          title: Role
          type: string
      required:
      - role
      - reason
      title: StaffRoleUpdate
      type: object
    SystemHealthMetrics:
      description: SystemHealthMetrics class.
      properties:
        active_tenants_24h:
          title: Active Tenants 24H
          type: integer
        average_response_time:
          title: Average Response Time
          type: number
        error_rate_percent:
          title: Error Rate Percent
          type: number
        revenue_metrics:
          additionalProperties:
            type: number
          title: Revenue Metrics
          type: object
        storage_usage_gb:
          title: Storage Usage Gb
          type: number
        total_api_calls_24h:
          title: Total Api Calls 24H
          type: integer
        total_tenants:
          title: Total Tenants
          type: integer
      required:
      - total_tenants
      - active_tenants_24h
      - total_api_calls_24h
      - average_response_time
      - error_rate_percent
      - storage_usage_gb
      - revenue_metrics
      title: SystemHealthMetrics
      type: object
    UsageMetrics:
      description: UsageMetrics class.
      properties:
        active_users:
          title: Active Users
          type: integer
        api_calls:
          title: Api Calls
          type: integer
        date:
          title: Date
          type: string
        memory_operations:
          title: Memory Operations
          type: integer
        response_time_p95:
          title: Response Time P95
          type: number
        storage_mb:
          title: Storage Mb
          type: number
        tenant_id:
          title: Tenant Id
          type: string
      required:
      - tenant_id
      - date
      - api_calls
      - memory_operations
      - storage_mb
      - active_users
      - response_time_p95
      title: UsageMetrics
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  description: Vendor Administration & Staff Management (SPEC-100 Compliant)
  title: Admin/Vendor Service
  version: 1.0.0
openapi: 3.1.0
paths:
  /admin/sta/:
    get:
      description: 'List all staff accounts (Admin only)


        - Filter by role

        - Filter by active status'
      operationId: list_staff_admin_sta__get
      parameters:
      - in: query
        name: role
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      - in: query
        name: active
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: true
          title: Active
      - in: query
        name: token
        required: false
        schema:
          title: Token
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/StaffResponse'
                title: Response List Staff Admin Sta  Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Staff
      tags:
      - Staff Management
    post:
      description: 'Create new staff account (Admin only)


        - Generates temporary password

        - Sends welcome email

        - Logs creation in audit trail'
      operationId: create_staff_admin_sta__post
      parameters:
      - in: query
        name: token
        required: false
        schema:
          title: Token
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffCreateResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Staff
      tags:
      - Staff Management
  /admin/sta/{staff_id}:
    delete:
      description: 'Deactivate staff account (Admin only)


        - Soft delete (sets is_active = false)

        - Logs deactivation with reason'
      operationId: deactivate_staff_admin_sta__staff_id__delete
      parameters:
      - in: path
        name: staff_id
        required: true
        schema:
          format: uuid
          title: Staff Id
          type: string
      - in: query
        name: token
        required: false
        schema:
          title: Token
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffDeactivate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Deactivate Staff
      tags:
      - Staff Management
    get:
      description: Get staff details by ID (Admin only)
      operationId: get_staff_admin_sta__staff_id__get
      parameters:
      - in: path
        name: staff_id
        required: true
        schema:
          format: uuid
          title: Staff Id
          type: string
      - in: query
        name: token
        required: false
        schema:
          title: Token
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Staff
      tags:
      - Staff Management
  /admin/sta/{staff_id}/activity:
    get:
      description: 'Get staff activity log (Admin only)


        - View all actions by staff member

        - Filter by time period'
      operationId: get_staff_activity_admin_sta__staff_id__activity_get
      parameters:
      - in: path
        name: staff_id
        required: true
        schema:
          format: uuid
          title: Staff Id
          type: string
      - in: query
        name: days
        required: false
        schema:
          default: 30
          title: Days
          type: integer
      - in: query
        name: token
        required: false
        schema:
          title: Token
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/StaffActivityResponse'
                title: Response Get Staff Activity Admin Sta  Staff Id  Activity Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Staff Activity
      tags:
      - Staff Management
  /admin/sta/{staff_id}/role:
    put:
      description: 'Update staff role (Admin only)


        - Changes staff role

        - Logs role change with reason'
      operationId: update_staff_role_admin_sta__staff_id__role_put
      parameters:
      - in: path
        name: staff_id
        required: true
        schema:
          format: uuid
          title: Staff Id
          type: string
      - in: query
        name: token
        required: false
        schema:
          title: Token
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffRoleUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Update Staff Role
      tags:
      - Staff Management
  /auth/staff/login:
    post:
      description: 'Staff login endpoint


        - Validates credentials

        - Returns JWT token with role and permissions

        - Logs login attempt'
      operationId: staff_login_auth_staff_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffLoginResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Staff Login
      tags:
      - Staff Authentication
  /auth/staff/logout:
    post:
      description: 'Staff logout endpoint


        - Logs logout action

        - Invalidates token (if using token blacklist)'
      operationId: staff_logout_auth_staff_logout_post
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Staff Logout
      tags:
      - Staff Authentication
  /auth/staff/reset-password:
    post:
      description: 'Reset staff password


        - Validates current password

        - Updates to new password

        - Logs password change'
      operationId: reset_password_auth_staff_reset_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Reset Password
      tags:
      - Staff Authentication
  /health:
    get:
      description: 'Basic liveness check (SPEC-100 compliant)


        Returns 200 OK if service is running.

        Does not check dependencies.'
      operationId: health_check_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
      summary: Health Check
      tags:
      - health
  /metrics:
    get:
      description: 'Prometheus-format metrics endpoint (SPEC-100 compliant)


        Exposes metrics in Prometheus text format for scraping.


        Metrics include:

        - Service information (version, uptime)

        - Request metrics (count, errors, latency)

        - Resource metrics (CPU, memory, files, threads)

        - Dependency health (DB, Redis, PgBouncer)'
      operationId: metrics_endpoint_metrics_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Metrics Endpoint
      tags:
      - metrics
  /ready:
    get:
      description: 'Readiness check with dependency validation (SPEC-100 compliant)


        Returns 200 OK if all dependencies are healthy.

        Returns 503 Service Unavailable if any dependency fails.


        Checks:

        - PostgreSQL connectivity

        - Redis connectivity

        - PgBouncer status'
      operationId: readiness_check_ready_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
          description: Successful Response
      summary: Readiness Check
      tags:
      - health
  /vendor/admin/audit-logs:
    get:
      description: Get admin audit logs with pagination and filtering.
      operationId: get_admin_audit_logs_vendor_admin_audit_logs_get
      parameters:
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 1000
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: action_filter
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Action Filter
      - in: query
        name: tenant_filter
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Filter
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Get Admin Audit Logs Vendor Admin Audit Logs Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Admin Audit Logs
      tags:
      - vendor_admin
  /vendor/admin/dashboard/overview:
    get:
      description: Get high-level system overview for vendor admin dashboard.
      operationId: get_admin_dashboard_overview_vendor_admin_dashboard_overview_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthMetrics'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Get Admin Dashboard Overview
      tags:
      - vendor_admin
  /vendor/admin/system/health:
    get:
      description: Get detailed system health information for vendor admin.
      operationId: get_system_health_detailed_vendor_admin_system_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Get System Health Detailed Vendor Admin System Health
                  Get
                type: object
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Get System Health Detailed
      tags:
      - vendor_admin
  /vendor/admin/tenants:
    get:
      description: List all tenants with pagination and filtering.
      operationId: list_all_tenants_vendor_admin_tenants_get
      parameters:
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: status_filter
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Filter
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response List All Tenants Vendor Admin Tenants Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List All Tenants
      tags:
      - vendor_admin
  /vendor/admin/tenants/{tenant_id}/rate-limits:
    get:
      description: Get current rate limit configuration for a tenant.
      operationId: get_tenant_rate_limits_vendor_admin_tenants__tenant_id__rate_limits_get
      parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          title: Tenant Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitConfig'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Tenant Rate Limits
      tags:
      - vendor_admin
    put:
      description: Update rate limit configuration for a tenant.
      operationId: update_tenant_rate_limits_vendor_admin_tenants__tenant_id__rate_limits_put
      parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          title: Tenant Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateLimitConfig'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Update Tenant Rate Limits Vendor Admin Tenants  Tenant
                  Id  Rate Limits Put
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Update Tenant Rate Limits
      tags:
      - vendor_admin
  /vendor/admin/tenants/{tenant_id}/reactivate:
    post:
      description: Reactivate a suspended tenant.
      operationId: reactivate_tenant_vendor_admin_tenants__tenant_id__reactivate_post
      parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          title: Tenant Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Reactivate Tenant Vendor Admin Tenants  Tenant Id  Reactivate
                  Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Reactivate Tenant
      tags:
      - vendor_admin
  /vendor/admin/tenants/{tenant_id}/suspend:
    post:
      description: Suspend a tenant (disable access while preserving data).
      operationId: suspend_tenant_vendor_admin_tenants__tenant_id__suspend_post
      parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          title: Tenant Id
          type: string
      - in: query
        name: reason
        required: true
        schema:
          title: Reason
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Suspend Tenant Vendor Admin Tenants  Tenant Id  Suspend
                  Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Suspend Tenant
      tags:
      - vendor_admin
  /vendor/admin/tenants/{tenant_id}/usage:
    get:
      description: Get detailed usage analytics for a specific tenant.
      operationId: get_tenant_usage_analytics_vendor_admin_tenants__tenant_id__usage_get
      parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          title: Tenant Id
          type: string
      - in: query
        name: days
        required: false
        schema:
          default: 30
          maximum: 365
