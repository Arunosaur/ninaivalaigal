      description: Request model for creating API key
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional description of key usage
          title: Description
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Optional expiration date
          title: Expires At
        name:
          description: Human-readable name for the API key
          title: Name
          type: string
        rate_limit_per_minute:
          default: 100
          description: Rate limit per minute
          title: Rate Limit Per Minute
          type: integer
        scopes:
          allOf:
          - $ref: '#/components/schemas/APIKeyScope'
          description: Permission scopes for the key
      required:
      - name
      title: APIKeyCreateRequest
      type: object
    APIKeyResponse:
      description: Response model for API key (without secret)
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        creator_id:
          title: Creator Id
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expires At
        id:
          title: Id
          type: string
        is_active:
          title: Is Active
          type: boolean
        last_used_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Used At
        name:
          title: Name
          type: string
        rate_limit_per_minute:
          title: Rate Limit Per Minute
