          anyOf:
          - type: string
          - type: 'null'
          title: Description
        id:
          format: uuid
          title: Id
          type: string
        member_count:
          title: Member Count
          type: integer
        name:
          title: Name
          type: string
        organization_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Organization Id
        updated_at:
          title: Updated At
          type: string
      required:
      - id
      - name
      - organization_id
      - description
      - member_count
      - created_at
      - updated_at
      title: TeamResponse
      type: object
    TeamUpdateRequest:
      description: Request model for updating a team
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        name:
          anyOf:
          - maxLength: 255
            minLength: 1
            type: string
          - type: 'null'
          title: Name
      title: TeamUpdateRequest
      type: object
    TokenRegenerateResponse:
      description: Response model for token regeneration.
      properties:
        expires_at:
          format: date-time
          title: Expires At
          type: string
        message:
          title: Message
          type: string
        token:
          title: Token
          type: string
      required:
      - token
      - expires_at
      - message
      title: TokenRegenerateResponse
      type: object
    TokenUsage:
      description: TokenUsage class.
      properties:
        last_used:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Used
        rate_limit_remaining:
          default: 1000
          title: Rate Limit Remaining
          type: integer
        rate_limit_total:
          default: 1000
          title: Rate Limit Total
          type: integer
        recent_activity:
          default: []
          items: {}
          title: Recent Activity
          type: array
        requests_today:
          default: 0
          title: Requests Today
          type: integer
        requests_week:
          default: 0
          title: Requests Week
          type: integer
      title: TokenUsage
      type: object
    UpdateVisibilityRequest:
      description: UpdateVisibilityRequest class.
      properties:
        visibility:
          description: 'Visibility: private, team, organization, public'
          title: Visibility
          type: string
      required:
      - visibility
      title: UpdateVisibilityRequest
      type: object
    UserLogin:
      description: UserLogin class.
      properties:
        email:
          format: email
          title: Email
          type: string
        password:
          title: Password
          type: string
      required:
      - email
      - password
      title: UserLogin
      type: object
    UserProfileResponse:
      description: Model for user profile response
      properties:
        account_type:
          title: Account Type
          type: string
        created_at:
          title: Created At
          type: string
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        email_verified:
          title: Email Verified
          type: boolean
        id:
          format: uuid
          title: Id
          type: string
        is_active:
          title: Is Active
          type: boolean
        last_login:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Login
        name:
          title: Name
          type: string
        role:
          title: Role
          type: string
        subscription_tier:
          title: Subscription Tier
          type: string
        username:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
      required:
      - id
      - username
      - email
      - name
      - account_type
      - subscription_tier
      - role
      - email_verified
      - is_active
      - created_at
      - last_login
      title: UserProfileResponse
      type: object
    UserProfileUpdate:
      description: Model for updating user profile
      properties:
        email:
          anyOf:
          - format: email
            type: string
          - type: 'null'
          title: Email
        name:
          anyOf:
          - maxLength: 255
            minLength: 1
            type: string
          - type: 'null'
          title: Name
        username:
          anyOf:
          - maxLength: 255
            minLength: 3
            type: string
          - type: 'null'
          title: Username
      title: UserProfileUpdate
      type: object
    UserSettings:
      description: User settings for token management.
      properties:
        auto_token_rotation:
          default: false
          title: Auto Token Rotation
          type: boolean
        ip_restrictions:
          default: []
          items:
            type: string
          title: Ip Restrictions
          type: array
      title: UserSettings
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
