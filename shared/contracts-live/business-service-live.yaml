openapi: 3.1.0
paths:
  /admin-analytics/alerts:
    get:
      description: Get active alerts and notifications
      operationId: get_active_alerts_admin_analytics_alerts_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  type: object
                title: Response Get Active Alerts Admin Analytics Alerts Get
                type: array
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Get Active Alerts
      tags:
      - admin
  /admin-analytics/alerts/acknowledge/{alert_id}:
    post:
      description: Acknowledge an alert
      operationId: acknowledge_alert_admin_analytics_alerts_acknowledge__alert_id__post
      parameters:
      - in: path
        name: alert_id
        required: true
        schema:
          title: Alert Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Acknowledge Alert Admin Analytics Alerts Acknowledge  Alert
                  Id  Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Acknowledge Alert
      tags:
      - admin
