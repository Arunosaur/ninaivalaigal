          anyOf:
          - type: integer
          - type: 'null'
          title: Team Filter
      - in: query
        name: include_scores
        required: false
        schema:
          default: false
          title: Include Scores
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Get Ranked Contexts Graph Rank Contexts Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Ranked Contexts
      tags:
      - ai-intelligence
  /graph-rank/insights:
    get:
      description: Get graph-based insights for dashboard usage
      operationId: get_graph_insights_graph_rank_insights_get
      parameters:
      - in: query
        name: team_filter
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Team Filter
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Get Graph Insights Graph Rank Insights Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Graph Insights
      tags:
      - ai-intelligence
  /graph-rank/memories:
    get:
      description: Get memories ranked by PageRank and enhanced signals
      operationId: get_ranked_memories_graph_rank_memories_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 10
          title: Limit
          type: integer
      - in: query
        name: team_filter
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Team Filter
      - in: query
        name: include_scores
        required: false
        schema:
          default: false
          title: Include Scores
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Get Ranked Memories Graph Rank Memories Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Ranked Memories
      tags:
      - ai-intelligence
  /graph-rank/recommendations/{user_id}:
    get:
      description: Get personalized memory recommendations based on PageRank and user
        behavior
      operationId: get_memory_recommendations_graph_rank_recommendations__user_id__get
      parameters:
      - in: path
        name: user_id
        required: true
        schema:
          title: User Id
          type: integer
      - in: query
        name: limit
        required: false
        schema:
          default: 5
          title: Limit
          type: integer
      - in: query
        name: recommendation_type
        required: false
        schema:
          default: similar
          title: Recommendation Type
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Get Memory Recommendations Graph Rank Recommendations  User
                  Id  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Memory Recommendations
      tags:
      - ai-intelligence
  /graph/health:
    get:
      description: Check GraphOps service health
      operationId: graphops_health_graph_health_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Graphops Health
      tags:
      - GraphOps
  /graph/query:
    post:
      description: 'Execute Cypher query via GraphOps Rust service

        Fallback to Python implementation if Rust service unavailable'
      operationId: execute_cypher_query_graph_query_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CypherRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphResult'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Execute Cypher Query
      tags:
      - GraphOps
  /health:
    get:
      description: 'Basic liveness check (SPEC-100 compliant)


        Returns 200 OK if service is running.

        Does not check dependencies.'
      operationId: health_check_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
      summary: Health Check
      tags:
      - health
  /insights/ai-performance:
    get:
      description: Get AI system performance metrics for PageRank and tag suggestions
      operationId: get_ai_performance_metrics_insights_ai_performance_get
      parameters:
