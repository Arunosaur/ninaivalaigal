components:
  schemas:
    AgentExecutionRequest:
      description: AgentExecutionRequest class.
      properties:
        context:
          anyOf:
          - type: object
          - type: 'null'
          title: Context
        execution_mode:
          anyOf:
          - type: string
          - type: 'null'
          title: Execution Mode
        temperature:
          anyOf:
          - type: number
          - type: 'null'
          default: 0.7
          title: Temperature
        user_id:
          title: User Id
          type: string
        user_prompt:
          title: User Prompt
          type: string
      required:
      - user_prompt
      - user_id
      title: AgentExecutionRequest
      type: object
    AgentExecutionResponse:
      description: AgentExecutionResponse class.
      properties:
        context_summary:
          title: Context Summary
          type: object
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        execution_id:
          title: Execution Id
          type: string
        execution_time:
          title: Execution Time
          type: number
        mode:
          title: Mode
          type: string
        result:
          anyOf:
          - {}
          - type: 'null'
          title: Result
        success:
          title: Success
          type: boolean
        tools_used:
          items:
            type: string
          title: Tools Used
          type: array
      required:
      - execution_id
      - success
      - execution_time
      - mode
      - tools_used
      - context_summary
      title: AgentExecutionResponse
      type: object
    CypherRequest:
      description: Request model for Cypher query execution
      properties:
        parameters:
          description: Query parameters
          title: Parameters
          type: object
        query:
          description: Cypher query string
          title: Query
          type: string
        timeout_ms:
          default: 5000
          description: Query timeout in milliseconds
          title: Timeout Ms
          type: integer
      required:
      - query
      title: CypherRequest
      type: object
    GraphEdge:
      description: Represents a graph edge
      properties:
        id:
          title: Id
          type: string
        properties:
          title: Properties
          type: object
        source:
          title: Source
          type: string
        target:
          title: Target
          type: string
        type:
          title: Type
          type: string
      required:
      - id
      - type
      - source
      - target
      - properties
      title: GraphEdge
      type: object
    GraphIntelligenceDeployRequest:
      description: GraphIntelligenceDeployRequest class.
      properties:
        force_redeploy:
          default: false
          title: Force Redeploy
          type: boolean
        graph_db_config:
          anyOf:
          - type: object
          - type: 'null'
          title: Graph Db Config
        redis_config:
          anyOf:
          - type: object
          - type: 'null'
          title: Redis Config
      title: GraphIntelligenceDeployRequest
      type: object
    GraphIntelligenceResponse:
      description: GraphIntelligenceResponse class.
      properties:
        capabilities:
          items:
            type: string
          title: Capabilities
          type: array
        components:
          items:
            type: string
          title: Components
          type: array
        deployment_time:
          anyOf:
          - type: number
          - type: 'null'
          title: Deployment Time
        health_status:
          title: Health Status
          type: string
        status:
          title: Status
          type: string
      required:
      - status
      - components
      - capabilities
      - health_status
      title: GraphIntelligenceResponse
      type: object
    GraphNode:
      description: Represents a graph node
      properties:
        id:
          title: Id
          type: string
        labels:
          items:
            type: string
          title: Labels
          type: array
        properties:
          title: Properties
          type: object
      required:
      - id
      - labels
      - properties
      title: GraphNode
      type: object
    GraphResult:
      description: Response model for graph query results
      properties:
        edges:
          items:
            $ref: '#/components/schemas/GraphEdge'
          title: Edges
          type: array
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        metrics:
          anyOf:
          - $ref: '#/components/schemas/QueryMetrics'
          - type: 'null'
        nodes:
          items:
            $ref: '#/components/schemas/GraphNode'
          title: Nodes
          type: array
      title: GraphResult
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthResponse:
      description: Health check response model
      properties:
        service:
          title: Service
          type: string
        status:
          title: Status
          type: string
        timestamp:
          title: Timestamp
          type: string
        uptime_seconds:
          title: Uptime Seconds
          type: number
        version:
          title: Version
          type: string
      required:
      - status
      - service
      - version
      - uptime_seconds
      - timestamp
      title: HealthResponse
      type: object
    IntentAnalysisRequest:
      description: IntentAnalysisRequest class.
      properties:
        context:
          anyOf:
          - type: object
          - type: 'null'
          title: Context
        user_prompt:
          title: User Prompt
          type: string
      required:
      - user_prompt
      title: IntentAnalysisRequest
      type: object
    IntentAnalysisResponse:
      description: IntentAnalysisResponse class.
      properties:
        alternative_modes:
          items:
            type: string
          title: Alternative Modes
          type: array
        confidence:
          title: Confidence
          type: number
        detected_intent:
          title: Detected Intent
          type: string
        explanation:
          title: Explanation
          type: object
      required:
      - detected_intent
      - confidence
      - explanation
      - alternative_modes
      title: IntentAnalysisResponse
      type: object
    QueryMetrics:
      description: Query execution metrics
      properties:
        cache_hit:
          default: false
          title: Cache Hit
          type: boolean
        edges_returned:
          title: Edges Returned
          type: integer
        execution_time_ms:
          title: Execution Time Ms
          type: number
        nodes_returned:
          title: Nodes Returned
          type: integer
      required:
      - execution_time_ms
      - nodes_returned
      - edges_returned
      title: QueryMetrics
      type: object
    ReadinessResponse:
      description: Readiness check response model
      properties:
        dependencies:
          title: Dependencies
          type: object
        service:
          title: Service
          type: string
        status:
          title: Status
          type: string
        timestamp:
          title: Timestamp
          type: string
        version:
          title: Version
          type: string
      required:
      - status
      - service
      - version
      - dependencies
      - timestamp
      title: ReadinessResponse
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  description: Graph Intelligence & AI Reasoning (SPEC-100 + SPEC-062 Compliant)
  title: Graph/AI Service
  version: 1.0.0
openapi: 3.1.0
paths:
  /agentic/analyze-intent:
    post:
      description: 'Analyze user intent and provide routing recommendations.


        Useful for understanding how the system would route a request

        without actually executing it.'
      operationId: analyze_intent_agentic_analyze_intent_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentAnalysisRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentAnalysisResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Analyze Intent
      tags:
      - agentic_intelligence
  /agentic/deploy-graph-intelligence:
    post:
      description: 'Deploy the complete graph intelligence stack (SPEC-060/061 integration).


        This endpoint deploys:

        - SPEC-061: Property Graph Intelligence Framework

        - SPEC-062: GraphOps Stack Integration

        - Performance optimization wrappers

        - Real-time monitoring integration'
      operationId: deploy_graph_intelligence_endpoint_agentic_deploy_graph_intelligence_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphIntelligenceDeployRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphIntelligenceResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Deploy Graph Intelligence Endpoint
      tags:
      - agentic_intelligence
  /agentic/execute:
    post:
      description: 'Execute an intelligent agent operation based on user prompt and
        context.


        This is the main entry point for agentic execution, providing:

        - Intent-based routing to specialized execution modes

        - Context-aware tool selection and orchestration

        - Memory injection and AI alignment

        - Execution tracing and observability'
      operationId: execute_agent_agentic_execute_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentExecutionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentExecutionResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Execute Agent
      tags:
      - agentic_intelligence
  /agentic/execution/metrics:
    get:
      description: Get comprehensive execution metrics from the agent core.
      operationId: get_execution_metrics_agentic_execution_metrics_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Get Execution Metrics
      tags:
      - agentic_intelligence
  /agentic/execution/{execution_id}/cancel:
    post:
      description: Cancel an active execution.
      operationId: cancel_execution_agentic_execution__execution_id__cancel_post
      parameters:
      - in: path
        name: execution_id
        required: true
        schema:
          title: Execution Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Cancel Execution
      tags:
      - agentic_intelligence
  /agentic/execution/{execution_id}/status:
    get:
      description: Get the status of a specific execution.
      operationId: get_execution_status_agentic_execution__execution_id__status_get
      parameters:
      - in: path
        name: execution_id
        required: true
        schema:
          title: Execution Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Execution Status
      tags:
      - agentic_intelligence
  /agentic/graph-intelligence/status:
    get:
      description: Get the current status of graph intelligence deployment.
      operationId: get_graph_intelligence_status_agentic_graph_intelligence_status_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Get Graph Intelligence Status
      tags:
      - agentic_intelligence
  /agentic/health:
    get:
      description: Comprehensive health check for agentic systems.
      operationId: agentic_health_check_agentic_health_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Agentic Health Check
      tags:
      - agentic_intelligence
  /agentic/modes:
    get:
      description: Get all available execution modes and their descriptions.
      operationId: get_available_modes_agentic_modes_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Get Available Modes
      tags:
      - agentic_intelligence
  /dashboard-widgets/layouts/{role}:
    get:
      description: Get dashboard layout for user role
      operationId: get_dashboard_layout_dashboard_widgets_layouts__role__get
      parameters:
      - in: path
        name: role
        required: true
        schema:
          title: Role
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Dashboard Layout
      tags:
      - dashboard
  /dashboard-widgets/widgets/{widget_id}:
    get:
      description: Get data for a specific widget
      operationId: get_widget_data_dashboard_widgets_widgets__widget_id__get
      parameters:
      - in: path
        name: widget_id
        required: true
        schema:
          title: Widget Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Widget Data
      tags:
      - dashboard
  /graph-rank/contexts:
    get:
      description: Get contexts ranked by PageRank and enhanced signals
      operationId: get_ranked_contexts_graph_rank_contexts_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 10
          title: Limit
          type: integer
      - in: query
        name: team_filter
        required: false
