  /insights/team/{team_id}/dashboard:
    get:
      description: Get comprehensive team dashboard insights
      operationId: get_team_dashboard_insights_team__team_id__dashboard_get
      parameters:
      - in: path
        name: team_id
        required: true
        schema:
          title: Team Id
          type: integer
      - in: query
        name: days_back
        required: false
        schema:
          default: 30
          title: Days Back
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Get Team Dashboard Insights Team  Team Id  Dashboard
                  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Team Dashboard
      tags:
      - dashboard
  /metrics:
    get:
      description: 'Prometheus-format metrics endpoint (SPEC-100 compliant)


        Exposes metrics in Prometheus text format for scraping.


        Metrics include:

        - Service information (version, uptime)

        - Request metrics (count, errors, latency)

        - Resource metrics (CPU, memory, files, threads)

        - Dependency health (DB, Redis, PgBouncer)'
      operationId: metrics_endpoint_metrics_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Metrics Endpoint
      tags:
      - metrics
  /performance/benchmarks:
    get:
      description: 'Get performance benchmarks and targets.


        Returns current performance against established targets.'
      operationId: get_performance_benchmarks_performance_benchmarks_get
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Get Performance Benchmarks Performance Benchmarks
                  Get
                type: object
          description: Successful Response
      summary: Get Performance Benchmarks
      tags:
      - performance
  /performance/cache/clear:
    post:
      description: 'Clear all caches for troubleshooting.


        Clears:

        - Query cache

        - Response cache

        - Async optimizer cache'
      operationId: clear_all_caches_performance_cache_clear_post
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Clear All Caches Performance Cache Clear Post
                type: object
          description: Successful Response
      summary: Clear All Caches
      tags:
      - performance
  /performance/graph/benchmarks:
    get:
      description: 'Get graph database performance benchmarks.


        Returns current graph performance against established targets.'
      operationId: get_graph_performance_benchmarks_performance_graph_benchmarks_get
      responses:
        '200':
