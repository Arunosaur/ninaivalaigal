        name: days_back
        required: false
        schema:
          default: 30
          title: Days Back
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Get Ai Performance Metrics Insights Ai Performance
                  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Ai Performance Metrics
      tags:
      - dashboard
  /insights/knowledge-hotspots:
    get:
      description: Get knowledge hotspots - most discussed and linked topics per context
      operationId: get_knowledge_hotspots_insights_knowledge_hotspots_get
      parameters:
      - in: query
        name: team_filter
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Team Filter
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Get Knowledge Hotspots Insights Knowledge Hotspots
                  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Knowledge Hotspots
      tags:
      - dashboard
  /insights/memory-trends:
    get:
      description: Get memory creation and engagement trends over time
      operationId: get_memory_trends_insights_memory_trends_get
      parameters:
      - in: query
        name: days_back
        required: false
        schema:
          default: 30
          title: Days Back
          type: integer
      - in: query
        name: team_filter
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Team Filter
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Get Memory Trends Insights Memory Trends Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Memory Trends
      tags:
      - dashboard
  /insights/sentiment-analysis:
    get:
      description: Get sentiment analysis across discussions and memories
      operationId: get_sentiment_analysis_insights_sentiment_analysis_get
      parameters:
      - in: query
        name: days_back
        required: false
        schema:
          default: 30
          title: Days Back
