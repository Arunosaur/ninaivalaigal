syntax = "proto3";

package ninaivalaigal.memory.v1;

option go_package = "github.com/arunosaur/ninaivalaigal/grpc-gateway/proto/memorypb";

import "google/protobuf/timestamp.proto";

// Memory Service - gRPC definitions
service MemoryService {
  // Store a new memory
  rpc Remember(RememberRequest) returns (RememberResponse);

  // Recall memories based on query
  rpc Recall(RecallRequest) returns (RecallResponse);

  // List all memories for a user
  rpc ListMemories(ListMemoriesRequest) returns (ListMemoriesResponse);

  // Health check
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// Remember (Store Memory)
message RememberRequest {
  string user_id = 1;
  string content = 2;
  string context = 3;
  map<string, string> metadata = 4;
}

message RememberResponse {
  string memory_id = 1;
  string status = 2;
  google.protobuf.Timestamp created_at = 3;
}

// Recall (Retrieve Memories)
message RecallRequest {
  string user_id = 1;
  string query = 2;
  int32 limit = 3;
  float threshold = 4; // similarity threshold
}

message RecallResponse {
  repeated Memory memories = 1;
  int32 total_count = 2;
}

// List Memories
message ListMemoriesRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListMemoriesResponse {
  repeated Memory memories = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// Memory object
message Memory {
  string id = 1;
  string user_id = 2;
  string content = 3;
  string context = 4;
  map<string, string> metadata = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  float relevance_score = 8; // for recall operations
}

// Health Check
message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;
  string version = 2;
  google.protobuf.Timestamp timestamp = 3;
}
