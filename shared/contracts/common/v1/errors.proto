// Common error types for all services

syntax = "proto3";

package common.v1;

option go_package = "github.com/Arunosaur/ninaivalaigal/shared/contracts/common/v1;commonv1";

// Standard error response
message Error {
  // Error code (e.g., "INVALID_INPUT", "NOT_FOUND")
  string code = 1;

  // Human-readable error message
  string message = 2;

  // Additional error details
  map<string, string> details = 3;

  // Timestamp when error occurred
  string timestamp = 4;

  // Request ID for tracing
  string request_id = 5;
}

// Validation error for field-level issues
message ValidationError {
  // Field that failed validation
  string field = 1;

  // Validation error message
  string message = 2;

  // Error code specific to validation
  string code = 3;
}

// Error response with multiple validation errors
message ValidationErrors {
  repeated ValidationError errors = 1;
}

// Common error codes enum
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_INPUT = 1;
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_UNAUTHORIZED = 3;
  ERROR_CODE_FORBIDDEN = 4;
  ERROR_CODE_CONFLICT = 5;
  ERROR_CODE_INTERNAL = 6;
  ERROR_CODE_SERVICE_UNAVAILABLE = 7;
  ERROR_CODE_RATE_LIMITED = 8;
}
