# RBAC & Pod Security Standards for ninaivalaigal (US-132, SPEC-015)
# Implements least-privilege access control and security hardening

---
# ServiceAccount: API pods with least-privilege access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ninaivalaigal-api-serviceaccount
  namespace: ninaivalaigal
  labels:
    app: ninaivalaigal-api
    component: backend
automountServiceAccountToken: true

---
# Role: Minimal permissions for API pods
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ninaivalaigal-api-role
  namespace: ninaivalaigal
  labels:
    app: ninaivalaigal-api
    component: backend
rules:
  # Allow API pods to read their own ConfigMaps and Secrets
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    resourceNames: ["api-config", "api-secret", "database-secret", "redis-secret", "postgres-secret"]
    verbs: ["get", "list"]
  # Allow reading Pod information for health checks
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # No write permissions - API pods should not modify Kubernetes resources

---
# RoleBinding: Bind Role to ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ninaivalaigal-api-rolebinding
  namespace: ninaivalaigal
  labels:
    app: ninaivalaigal-api
    component: backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ninaivalaigal-api-role
subjects:
  - kind: ServiceAccount
    name: ninaivalaigal-api-serviceaccount
    namespace: ninaivalaigal
