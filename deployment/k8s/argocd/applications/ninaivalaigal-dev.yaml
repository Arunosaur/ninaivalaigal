apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ninaivalaigal-dev
  namespace: argocd
  labels:
    environment: dev
    project: ninaivalaigal
spec:
  project: ninaivalaigal
  source:
    repoURL: https://github.com/Arunosaur/ninaivalaigal.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: ninaivalaigal-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
