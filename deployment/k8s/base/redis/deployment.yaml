apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        component: cache
    spec:
      # Pod Security Context: Run as non-root user (US-132, SPEC-015)
      securityContext:
        runAsNonRoot: true
        runAsUser: 999  # Redis user ID in official image
        runAsGroup: 999
        fsGroup: 999
        # Drop all capabilities
        capabilities:
          drop:
            - ALL
        # Read-only root filesystem (Redis needs writes to data dir, so false)
        readOnlyRootFilesystem: false
      containers:
      - name: redis
        image: redis:7-alpine
        # Container Security Context
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false  # Redis needs to write to data directory
          runAsNonRoot: true
          runAsUser: 999  # Redis user ID
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - /etc/redis/redis.conf
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        volumeMounts:
        - name: redis-config
          mountPath: /etc/redis
        - name: redis-data
          mountPath: /data
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: redis-config
        configMap:
          name: redis-config
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc
