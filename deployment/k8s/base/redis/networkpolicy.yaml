apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-networkpolicy
  labels:
    app: redis
    component: cache
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from API pods only
    - from:
        - podSelector:
            matchLabels:
              app: ninaivalaigal-api
      ports:
        - protocol: TCP
          port: 6379
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Redis typically doesn't need outbound connections
    # but we allow minimal egress for DNS
    - {}
