apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-networkpolicy
  labels:
    app: postgresql
    component: database
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from API pods only
    - from:
        - podSelector:
            matchLabels:
              app: ninaivalaigal-api
      ports:
        - protocol: TCP
          port: 5432
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow PostgreSQL to make outbound connections if needed (e.g., for replication)
    # Restrict this further based on your requirements
    - {}
