# PostgreSQL Primary Deployment
# US-950: DB-REPL-001: PostgreSQL Streaming Replication Setup
# SPEC-153: Database Replication & High Availability
# Note: This is the primary database. For replicas, see replica-statefulset.yaml
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  labels:
    app: postgresql
    component: database
    role: primary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
        component: database
    spec:
      # Pod Security Context: Run as non-root user (US-132, SPEC-015)
      securityContext:
        runAsNonRoot: true
        runAsUser: 999  # PostgreSQL user ID in official image
        runAsGroup: 999
        fsGroup: 999
        # Drop all capabilities
        capabilities:
          drop:
            - ALL
        # Read-only root filesystem (PostgreSQL needs writes to data dir, so false)
        readOnlyRootFilesystem: false
      containers:
      - name: postgresql
        image: postgres:15-alpine
        # Container Security Context
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false  # PostgreSQL needs to write to data directory
          runAsNonRoot: true
          runAsUser: 999  # PostgreSQL user ID
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "foundation_test"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: password
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: postgresql-storage
          mountPath: /var/lib/postgresql/data
        - name: postgresql-config
          mountPath: /etc/postgresql/postgresql.conf
          subPath: postgresql.conf
        - name: postgresql-hba
          mountPath: /etc/postgresql/pg_hba.conf
          subPath: pg_hba.conf
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgresql-storage
        persistentVolumeClaim:
          claimName: postgresql-pvc
      - name: postgresql-config
        configMap:
          name: postgresql-config
      - name: postgresql-hba
        configMap:
          name: postgresql-hba
      - name: init-scripts
        configMap:
          name: postgresql-init
