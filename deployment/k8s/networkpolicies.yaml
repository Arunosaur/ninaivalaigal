# Network Policies for ninaivalaigal (US-131, SPEC-015)
# Implements zero-trust network segmentation and security

---
# NetworkPolicy: API Service
# Allows ingress from Ingress Controller only
# Allows egress to PostgreSQL and Redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ninaivalaigal-api-networkpolicy
  namespace: ninaivalaigal
  labels:
    app: ninaivalaigal-api
    component: backend
spec:
  podSelector:
    matchLabels:
      app: ninaivalaigal-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from Ingress Controller (nginx ingress)
    - from:
        # Common nginx ingress controller selectors
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              name: kube-system
          podSelector:
            matchLabels:
              app: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    # Allow ingress from API pods for health checks/internal communication
    - from:
        - podSelector:
            matchLabels:
              app: ninaivalaigal-api
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow egress to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow egress to Redis
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow egress to external API endpoints (for integrations)
    - {}

---
# NetworkPolicy: PostgreSQL Database
# Allows ingress from API pods only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-networkpolicy
  namespace: ninaivalaigal
  labels:
    app: postgres
    component: database
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from API pods only
    - from:
        - podSelector:
            matchLabels:
              app: ninaivalaigal-api
      ports:
        - protocol: TCP
          port: 5432
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow PostgreSQL to make outbound connections if needed (e.g., for replication)
    # Restrict this further based on your requirements
    - {}

---
# NetworkPolicy: Redis Cache
# Allows ingress from API pods only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-networkpolicy
  namespace: ninaivalaigal
  labels:
    app: redis
    component: cache
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from API pods only
    - from:
        - podSelector:
            matchLabels:
              app: ninaivalaigal-api
      ports:
        - protocol: TCP
          port: 6379
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Redis typically doesn't need outbound connections
    # but we allow minimal egress for DNS
    - {}
