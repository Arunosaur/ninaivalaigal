# Traefik Dynamic Configuration
# Task #83: Service Routing Rules

http:
  # Routers
  routers:
    # Core API Router
    core-api:
      rule: "PathPrefix(`/api`)"
      service: core-api-service
      middlewares:
        - core-api-stripprefix
        - rate-limit
        - cors-headers
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt

    # Business Service Router
    business-api:
      rule: "PathPrefix(`/business`)"
      service: business-service
      middlewares:
        - business-stripprefix
        - rate-limit
        - cors-headers
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt

    # Memory Service Router
    memory-api:
      rule: "PathPrefix(`/memory`)"
      service: memory-service
      middlewares:
        - memory-stripprefix
        - rate-limit
        - cors-headers
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt

    # GraphOps Service Router
    graph-api:
      rule: "PathPrefix(`/graph`)"
      service: graph-service
      middlewares:
        - graph-stripprefix
        - rate-limit
        - cors-headers
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt

    # Gateway Health Check
    gateway-health:
      rule: "Path(`/health`)"
      service: ping@internal
      entryPoints:
        - web

    # Metrics Endpoint
    gateway-metrics:
      rule: "Path(`/metrics`)"
      service: prometheus@internal
      entryPoints:
        - web

  # Services
  services:
    core-api-service:
      loadBalancer:
        servers:
          - url: "http://core-api:8000"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s

    business-service:
      loadBalancer:
        servers:
          - url: "http://business-api:8001"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s

    memory-service:
      loadBalancer:
        servers:
          - url: "http://memory-service:13393"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s

    graph-service:
      loadBalancer:
        servers:
          - url: "http://graphops:13394"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s

  # Middlewares
  middlewares:
    # Strip Path Prefixes
    core-api-stripprefix:
      stripPrefix:
        prefixes:
          - "/api"

    business-stripprefix:
      stripPrefix:
        prefixes:
          - "/business"

    memory-stripprefix:
      stripPrefix:
        prefixes:
          - "/memory"

    graph-stripprefix:
      stripPrefix:
        prefixes:
          - "/graph"

    # Rate Limiting
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1s

    # CORS Headers
    cors-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        accessControlAllowHeaders:
          - "*"
        accessControlAllowOriginList:
          - "http://localhost:3000"
          - "http://localhost:8080"
        accessControlMaxAge: 100
        addVaryHeader: true

    # Security Headers
    security-headers:
      headers:
        sslRedirect: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"

    # Request Size Limit
    request-limit:
      buffering:
        maxRequestBodyBytes: 10485760  # 10MB

# TCP/UDP routing (if needed)
tcp:
  routers: {}
  services: {}

udp:
  routers: {}
  services: {}
