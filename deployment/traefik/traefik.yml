# Traefik Static Configuration
# Task #83: API Gateway Deployment

# API Configuration
api:
  dashboard: true
  insecure: true  # Dev only - secure in production

# Entry Points
entryPoints:
  web:
    address: ":80"
    # HTTP to HTTPS redirect disabled for dev
    # Uncomment for production:
    # http:
    #   redirections:
    #     entryPoint:
    #       to: websecure
    #       scheme: https

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

# Providers
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: ninaivalaigal-network

  file:
    directory: /etc/traefik/dynamic
    watch: true

# Certificate Resolver (Let's Encrypt)
certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@ninaivalaigal.com
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

# Logging
log:
  level: INFO
  format: json
  filePath: /var/log/traefik/traefik.log

# Access Logs
accessLog:
  format: json
  filePath: /var/log/traefik/access.log
  bufferingSize: 100
  filters:
    statusCodes:
      - "200-299"
      - "400-499"
      - "500-599"
  fields:
    defaultMode: keep
    names:
      ClientUsername: drop
    headers:
      defaultMode: keep
      names:
        User-Agent: keep
        Authorization: drop
        Content-Type: keep

# Metrics
metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    entryPoint: metrics

# Health Check
ping:
  entryPoint: web

# Tracing (OpenTelemetry ready)
# tracing:
#   serviceName: ninaivalaigal-gateway
#   spanNameLimit: 150
