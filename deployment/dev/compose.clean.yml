networks:
  ninaivalaigal_dev_network:
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:15
    container_name: ninaivalaigal-${NINA_ENV:-dev}-db
    environment:
      POSTGRES_DB: ninaivalaigal_${NINA_ENV:-dev}
      POSTGRES_USER: nina
      POSTGRES_PASSWORD: ${NINA_DB_PASSWORD:-secure_nina_password}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nina -d ninaivalaigal_${NINA_ENV:-dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ninaivalaigal_dev_network

  redis:
    image: redis:7-alpine
    container_name: ninaivalaigal-${NINA_ENV:-dev}-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ninaivalaigal_dev_network

  api:
    image: ninaivalaigal-minimal-api
    container_name: ninaivalaigal-${NINA_ENV:-dev}-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      NINA_ENV: ${NINA_ENV:-dev}
      NINA_RUNTIME: ${NINA_RUNTIME:-docker}
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ninaivalaigal_dev_network

  ui:
    image: ninaivalaigal-ui
    container_name: ninaivalaigal-${NINA_ENV:-dev}-ui
    ports:
      - "${UI_PORT:-3000}:3000"
    environment:
      NINA_ENV: ${NINA_ENV:-dev}
      NINA_RUNTIME: ${NINA_RUNTIME:-docker}
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - ninaivalaigal_dev_network
