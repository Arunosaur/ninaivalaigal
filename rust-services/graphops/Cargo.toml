[package]
name = "graphops-service"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
tokio = { version = "1.34", features = ["full"] }
tonic = { version = "0.10", features = ["transport"] }
prost = "0.12"
tokio-postgres = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
prometheus = { version = "0.13", features = ["process"] }
lazy_static = "1.4"
hyper = { version = "0.14", features = ["full"] }
http-body-util = "0.1"
sysinfo = "0.30"
clap = { version = "4.5", features = ["derive", "env"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
dotenvy = "0.15"

[build-dependencies]
tonic-build = "0.10"

[[bench]]
name = "graphops_benchmark"
harness = false
