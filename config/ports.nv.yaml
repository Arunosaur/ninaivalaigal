# Ninaivalaigal Canonical Port Matrix V2
# Machine-readable port allocation for automated validation
# Reference: SPEC-086 Multi-Runtime Port Allocation

version: "2.1"
updated: "2025-10-16"

# Port calculation formula
formula:
  base_ports:
    postgresql: 5432
    pgbouncer: 6432
    redis: 6379
    api: 13370
    ui_external: 8081
    ui_internal: 8181
    em: 8281

  runtime_offset:
    docker: 0
    colima: 10
    apple: 20

  environment_offset:
    dev: 0
    test: 100
    prod: 200

# Complete port matrix (3 runtimes × 3 environments × 7 services)
matrix:
  docker:
