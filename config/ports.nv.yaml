naming_conventions:
  container_pattern: ninaivalaigal-{env}-{service}
  database_pattern: ninaivalaigal_{env}
  age_graph_pattern: ninaivalaigal_intelligence_{env}
  script_pattern: nv-{service}-{action}.sh
  rationale: 'Option A (Full Suffixes) chosen for:

    - Multi-environment support on same host (dev + test + prod)

    - Self-documenting database dumps

    - Clear separation for shared infrastructure

    '
  examples:
    containers:
    - ninaivalaigal-dev-db
    - ninaivalaigal-dev-core-api
    - ninaivalaigal-test-memory-service
    - ninaivalaigal-prod-gateway
    databases:
    - ninaivalaigal_dev
    - ninaivalaigal_test
    - ninaivalaigal_prod
    age_graphs:
    - ninaivalaigal_intelligence_dev
    - ninaivalaigal_intelligence_test
    - ninaivalaigal_intelligence_prod
    scripts:
    - nv-core-api-start.sh
    - nv-memory-service-stop.sh
    - nv-db-start.sh
container_names:
  database: ninaivalaigal-{env}-db
  pgbouncer: ninaivalaigal-{env}-pgbouncer
  redis: ninaivalaigal-{env}-redis
  api: ninaivalaigal-{env}-api
  ui_customer: ninaivalaigal-{env}-ui-customer
  ui_admin: ninaivalaigal-{env}-ui-admin
  em: ninaivalaigal-{env}-em
  core_api: ninaivalaigal-{env}-core-api
  business_logic: ninaivalaigal-{env}-business-logic
  admin_vendor: ninaivalaigal-{env}-admin-vendor
  memory_service: ninaivalaigal-{env}-memory-service
  graph_service: ninaivalaigal-{env}-graph-service
  gateway: ninaivalaigal-{env}-gateway
  graphops: ninaivalaigal-{env}-graphops
  load_tester: ninaivalaigal-{env}-load-tester
  cli_tools: ninaivalaigal-{env}-cli-tools
services:
  postgresql:
    description: PostgreSQL 15 with pgvector
    container_port: 5432
    protocol: tcp
    health_check: pg_isready -U nina
  pgbouncer:
    description: Connection pooler (SCRAM-SHA-256)
    container_port: 6432
    protocol: tcp
    health_check: psql -h localhost -p 6432 -U nina -c 'SELECT 1;'
  redis:
    description: Cache & rate limiting
    container_port: 6379
    protocol: tcp
    health_check: redis-cli ping
  api:
    description: FastAPI backend
    container_port: 8000
    protocol: http
    health_check: curl -f http://localhost:8000/health
  ui_external:
    description: Customer-facing UI
    container_port: 8101
    protocol: http
    health_check: curl -f http://localhost:{host_port}/
  ui_internal:
    description: Admin console
    container_port: 8102
    protocol: http
    health_check: curl -f http://localhost:{host_port}/
  em:
    description: Enhanced Memory (mem0ai) orchestrator
    container_port: 7070
    protocol: http
    health_check: curl -f http://localhost:{host_port}/health
  core_api:
    description: Core API - Auth, Users, Teams, Organizations
    container_port: 8000
    protocol: http
    health_check: curl -f http://localhost:{host_port}/health
    api_docs: http://localhost:{host_port}/docs
    redoc: http://localhost:{host_port}/redoc
    openapi_schema: http://localhost:{host_port}/openapi.json
  business_logic:
    description: Business Logic - Workflows, Operations
    container_port: 8000
    protocol: http
    health_check: curl -f http://localhost:{host_port}/health
    api_docs: http://localhost:{host_port}/docs
    redoc: http://localhost:{host_port}/redoc
    openapi_schema: http://localhost:{host_port}/openapi.json
  admin_vendor:
    description: Admin/Vendor Management
    container_port: 8000
    protocol: http
    health_check: curl -f http://localhost:{host_port}/health
    api_docs: http://localhost:{host_port}/docs
    redoc: http://localhost:{host_port}/redoc
    openapi_schema: http://localhost:{host_port}/openapi.json
  memory_service:
    description: Memory Service (Rust) - CRUD operations
    container_port: 8000
    protocol: http
    health_check: curl -f http://localhost:{host_port}/health
    api_docs: http://localhost:{host_port}/docs
    note: OpenAPI docs when deployed
  graph_service:
    description: Graph Service (Rust) - Intelligence operations
    container_port: 8000
    protocol: http
    health_check: curl -f http://localhost:{host_port}/health
    api_docs: http://localhost:{host_port}/docs
    redoc: http://localhost:{host_port}/redoc
    openapi_schema: http://localhost:{host_port}/openapi.json
    note: All endpoints under /api/v1/graph/* (SPEC-100)
  gateway:
    description: API Gateway (Traefik) - HTTP/HTTPS Reverse Proxy
    container_port: 80
    container_port_https: 443
    container_port_dashboard: 8080
    protocol: http
    health_check: curl -f http://localhost/ping
    dashboard: http://localhost:8080
    note: Uses standard ports 80/443, not subject to runtime offsets
  graphops:
    description: GraphOps gRPC Service (Rust) - Graph operations via gRPC
    container_port: 50051
    host_port: 13398
    metrics_container_port: 9090
    metrics_host_port: 9091
    protocol: grpc
    internal_access: Use container IP with port 50051 for service-to-service communication
    external_access: Use localhost:13398 for external clients (grpcurl, testing)
    health_check: /usr/local/bin/graphops --health-check
    grpc_reflection: enabled
    explore: grpcurl -plaintext localhost:13398 list
    metrics: http://localhost:9091/metrics
    note: 'Task #49 - gRPC+HTTP service on 13398 (139xx range), metrics on 9091 (avoid Prometheus conflict on 9090)'
  load_tester:
    description: Go Load Testing Tool - Concurrent benchmarking
    container_port: 8080
    protocol: http
    health_check: ./load-tester --help
  cli_tools:
    description: Go CLI Tools - Operational utilities
    container_port: 8080
    protocol: http
    health_check: ./cli-tools --version
  prometheus:
    description: Prometheus Metrics Collection - Observability
    container_port: 9090
    host_port: 9090
    protocol: http
    health_check: curl -f http://localhost:9090/-/ready
    ui: http://localhost:9090
    targets: http://localhost:9090/targets
    alerts: http://localhost:9090/alerts
    note: US#102 - Metrics collection for all services
  grafana:
    description: Grafana Monitoring Dashboards - Visualization
    container_port: 3000
    host_port: 3001
    protocol: http
    health_check: curl -f http://localhost:3001/api/health
    ui: http://localhost:3001
    default_credentials: admin/admin
    note: US#102 - Real-time monitoring dashboards and SLO tracking
  loki:
    description: Grafana Loki - Log Aggregation (SIEM)
    container_port: 3100
    host_port: 3100
    protocol: http
    health_check: curl -f http://localhost:3100/ready
    ui: http://localhost:3100
    note: US#619 - Centralized log aggregation with 30-day retention
  promtail:
    description: Promtail - Log Collection Agent
    container_port: 9080
    host_port: 9080
    protocol: http
    health_check: curl -f http://localhost:9080/ready
    note: US#619 - Collects logs from Docker containers and sends to Loki
