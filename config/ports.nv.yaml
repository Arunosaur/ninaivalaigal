# Naming Conventions (Option A: Full Suffixes)
# Enables running multiple environments on same host
naming_conventions:
  container_pattern: "ninaivalaigal-{env}-{service}"
  database_pattern: "ninaivalaigal_{env}"
  age_graph_pattern: "ninaivalaigal_intelligence_{env}"
  script_pattern: "nv-{service}-{action}.sh"

  rationale: |
    Option A (Full Suffixes) chosen for:
    - Multi-environment support on same host (dev + test + prod)
    - Self-documenting database dumps
    - Clear separation for shared infrastructure

  examples:
    containers:
      - "ninaivalaigal-dev-db"
      - "ninaivalaigal-dev-core-api"
      - "ninaivalaigal-test-memory-service"
      - "ninaivalaigal-prod-gateway"
    databases:
      - "ninaivalaigal_dev"
      - "ninaivalaigal_test"
      - "ninaivalaigal_prod"
    age_graphs:
      - "ninaivalaigal_intelligence_dev"
      - "ninaivalaigal_intelligence_test"
      - "ninaivalaigal_intelligence_prod"
    scripts:
      - "nv-core-api-start.sh"
      - "nv-memory-service-stop.sh"
      - "nv-db-start.sh"

# Container name patterns
# NOTE: Containers are named by environment only, NOT by runtime
# All runtimes share the same container names per environment
container_names:
  database: "ninaivalaigal-{env}-db"
  pgbouncer: "ninaivalaigal-{env}-pgbouncer"
  redis: "ninaivalaigal-{env}-redis"
  api: "ninaivalaigal-{env}-api"
  ui_customer: "ninaivalaigal-{env}-ui-customer"
  ui_admin: "ninaivalaigal-{env}-ui-admin"
  em: "ninaivalaigal-{env}-em"
  # Microservices (SPEC-100 Stage 3)
  core_api: "ninaivalaigal-{env}-core-api"
  business_logic: "ninaivalaigal-{env}-business-logic"
  admin_vendor: "ninaivalaigal-{env}-admin-vendor"
  memory_service: "ninaivalaigal-{env}-memory-service"
  graph_service: "ninaivalaigal-{env}-graph-service"
  gateway: "ninaivalaigal-{env}-gateway"
  # Developer A Infrastructure (SPEC-099)
  load_tester: "ninaivalaigal-{env}-load-tester"
  cli_tools: "ninaivalaigal-{env}-cli-tools"

# Service metadata
services:
  postgresql:
    description: "PostgreSQL 15 with pgvector"
    container_port: 5432
    protocol: "tcp"
    health_check: "pg_isready -U nina"

  pgbouncer:
    description: "Connection pooler (SCRAM-SHA-256)"
    container_port: 6432
    protocol: "tcp"
    health_check: "psql -h localhost -p 6432 -U nina -c 'SELECT 1;'"

  redis:
    description: "Cache & rate limiting"
    container_port: 6379
    protocol: "tcp"
    health_check: "redis-cli ping"

  api:
    description: "FastAPI backend"
    container_port: 8000
    protocol: "http"
    health_check: "curl -f http://localhost:8000/health"

  ui_external:
    description: "Customer-facing UI"
    container_port: 8101  # Internal container port
    protocol: "http"
    health_check: "curl -f http://localhost:{host_port}/"

  ui_internal:
    description: "Admin console"
    container_port: 8102  # Internal container port
    protocol: "http"
    health_check: "curl -f http://localhost:{host_port}/"

  em:
    description: "Enhanced Memory (mem0ai) orchestrator"
    container_port: 7070
    protocol: "http"
    health_check: "curl -f http://localhost:{host_port}/health"

  # Microservices (SPEC-100 Stage 3)
  core_api:
    description: "Core API - Auth, Users, Teams, Organizations"
    container_port: 8000
    protocol: "http"
    health_check: "curl -f http://localhost:{host_port}/health"

  business_logic:
    description: "Business Logic - Workflows, Operations"
    container_port: 8000
    protocol: "http"
    health_check: "curl -f http://localhost:{host_port}/health"

  admin_vendor:
    description: "Admin/Vendor Management"
    container_port: 8000
    protocol: "http"
    health_check: "curl -f http://localhost:{host_port}/health"

  memory_service:
    description: "Memory Service (Rust) - CRUD operations"
    container_port: 8000
    protocol: "http"
    health_check: "curl -f http://localhost:{host_port}/health"

  graph_service:
    description: "Graph Service (Rust) - Intelligence operations"
    container_port: 8000
    protocol: "http"
    health_check: "curl -f http://localhost:{host_port}/health"

  gateway:
    description: "API Gateway (Rust) - gRPC service mesh"
    container_port: 8000
    protocol: "grpc"
    health_check: "grpcurl -plaintext localhost:{host_port} health"

  # Developer A Infrastructure (SPEC-099)
  load_tester:
    description: "Go Load Testing Tool - Concurrent benchmarking"
    container_port: 8080
    protocol: "http"
    health_check: "./load-tester --help"

  cli_tools:
    description: "Go CLI Tools - Operational utilities"
    container_port: 8080
    protocol: "http"
    health_check: "./cli-tools --version"

# Port range reservations
port_ranges:
  postgresql:
    start: 5432
    end: 5699
    total: 268

  pgbouncer:
    start: 6432
    end: 6699
    total: 268

  redis:
    start: 6379
    end: 6699
    total: 321

  api:
    start: 13370
    end: 13699
    total: 330

  ui_external:
    start: 8081
    end: 8299
    total: 219

  ui_internal:
    start: 8181
    end: 8399
    total: 219

  em:
    start: 8281
    end: 8499
    total: 219

# Validation rules
validation:
  required_services:
    - postgresql
    - pgbouncer
    - redis
    - api
    - ui_external
    - ui_internal

  optional_services:
    - em

  port_collision_check: true
  container_name_check: true
  health_check_timeout: 30  # seconds
