# Traefik API Gateway Configuration
# US #83: API Gateway Path Routing

api:
  dashboard: true
  insecure: true  # Dev only - use TLS in prod

entryPoints:
  web:
    address: ":80"

  metrics:
    address: ":8080"

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  level: INFO

accessLog:
  format: json
