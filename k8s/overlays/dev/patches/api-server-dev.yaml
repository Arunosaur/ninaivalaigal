apiVersion: apps/v1
kind: Deployment
metadata:
  name: ninaivalaigal-api
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: api-server
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        env:
        - name: ENVIRONMENT
          value: "development"
        - name: DEBUG
          value: "true"
        - name: LOG_LEVEL
          value: "DEBUG"
