apiVersion: apps/v1
kind: Deployment
metadata:
  name: ninaivalaigal-api
  labels:
    app: ninaivalaigal-api
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ninaivalaigal-api
  template:
    metadata:
      labels:
        app: ninaivalaigal-api
        component: backend
    spec:
      containers:
      - name: api-server
        image: ninaivalaigal/api-server:latest
        ports:
        - containerPort: 13370
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: jwt-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 13370
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 13370
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: api-config
      imagePullSecrets:
      - name: registry-secret
