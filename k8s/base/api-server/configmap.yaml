apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  labels:
    app: ninaivalaigal-api
    component: backend
data:
  app.yaml: |
    server:
      host: "0.0.0.0"
      port: 13370
      cors_origins: ["*"]

    database:
      pool_size: 10
      max_overflow: 20
      pool_timeout: 30
      pool_recycle: 3600

    redis:
      max_connections: 100
      socket_timeout: 5
      socket_connect_timeout: 5

    logging:
      level: "INFO"
      format: "json"

    monitoring:
      enabled: true
      metrics_port: 9090
      health_check_interval: 30

    features:
      memory_feedback_loop: true
      graph_capabilities: true
      advanced_analytics: true
