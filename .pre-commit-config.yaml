default_language_version:
  python: python3

# Exclude problematic dependencies that cause version conflicts
exclude: |
  (?x)^(
    external/spec-013/.*|
    vscode-client/dist/.*|
    vscode-client/node_modules/.*|
    node_modules/.*|
    .*\.lock$|
    .*requirements.*\.txt$|
    .*__pycache__.*|
    .*\.pyc$|
    graph-validation/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        additional_dependencies: [flake8-docstrings, flake8-bugbear]
        exclude: ^(server/.*\.py|tests/.*\.py|test_.*\.py|alembic/.*\.py|specs/.*/tests/.*\.py|coverage/.*\.py|scripts/.*\.py|run_server\.py|mem0|ninaivalaigal_ci_rbac_pack/.*)$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-redis, types-python-dateutil]
        args: [--ignore-missing-imports, --no-strict-optional]
        exclude: ^(server/.*\.py|tests/.*\.py|test_.*\.py|alembic/.*\.py|node_modules/.*|graph-validation/.*|coverage/.*\.py|scripts/.*\.py|run_server\.py|mem0|ninaivalaigal_ci_rbac_pack/.*)$

  # - repo: https://github.com/pycqa/bandit
  #   rev: 1.7.5
  #   hooks:
  #     - id: bandit
  #       files: ^server/.*\.py$
  #       args: ["-f", "json"]
  #       exclude: ^(tests/|scripts/|server/database/operations/|server/performance/|server/middleware/|server/performance_api\.py|server/graph/|server/agent/|server/agentic_api\.py)

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        files: ^scripts/.*\.sh$
        args: ["-e", "SC1091", "-e", "SC2129", "-e", "SC2181", "-e", "SC2329", "-e", "SC2162", "-e", "SC2207", "-e", "SC2046", "-e", "SC2126", "-e", "SC1090", "-e", "SC1003", "-e", "SC2148", "-e", "SC1009", "-e", "SC1073", "-e", "SC1072", "-e", "SC1089", "-e", "SC2012", "-e", "SC2001", "-e", "SC2235", "-e", "SC2009"]  # Ignore common issues

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
              server/performance/.*\.py|
              server/monitoring/.*\.py|
              server/graph/.*\.py|
              server/agent/.*\.py|
              server/agentic_api\.py|
              tests/test_agentic_execution\.py|
              .*__pycache__.*|
              .*/migrations/.*|
              .*/node_modules/.*
          )$
