default_language_version:
  python: python3

# Minimal exclusions - only build artifacts, external dependencies, third-party vendor code, and backup files
exclude: |
  (?x)^(
    external/spec-013/.*|
    vscode-client/dist/.*|
    vscode-client/node_modules/.*|
    node_modules/.*|
    client-tools/vendor/.*|
    .*_backup\.py$|
    .*\.lock$|
    .*__pycache__.*|
    .*\.pyc$
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-added-large-files
        args: ['--maxkb=5000']
        exclude: 'package-lock\.json$'
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        additional_dependencies: [flake8-docstrings, flake8-bugbear]
        args: [
          "--per-file-ignores=services/core-api/main_with_auth.py:E402 services/core-api/main.py:E402,D403",
          "--extend-ignore=D100,D101,D102,D103,D104,D105,D106,D107,D200,D202,D205,D400,D401,E203,B008,B007",
          "--max-line-length=120"
        ]
        exclude: |
          (?x)^(
            client-tools/vendor/.*|
            external/spec-013/.*|
            vscode-client/.*|
            node_modules/.*|
            .*_pb2\.py$|
            .*_pb2_grpc\.py$|
            .*/benchmarks/.*\.py$|
            ci/.*\.py$
          )$

  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.7.1
  #   hooks:
  #     - id: mypy
  #       additional_dependencies: [types-requests, types-redis, types-python-dateutil]
  #       args: [--ignore-missing-imports, --no-strict-optional]
  #       exclude: ^(client-tools/mem0|client-tools/eM|sidecar/main\.py|mcp_server/main\.py)$
  #   # Note: Temporarily disabled due to duplicate module name issues across codebase
  #   # Will be re-enabled once module naming conflicts are resolved

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: ["-c", ".bandit", "-r", "server/"]
        files: ^server/.*\.py$

  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        files: ^scripts/.*\.sh$
        args: ["--severity=warning"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: scripts/restart-api-with-latest-code.sh

  # SPDX License Header Validation
  - repo: local
    hooks:
      - id: check-spdx-headers
        name: Check SPDX License Headers
        entry: .pre-commit-hooks/check-spdx-headers.sh
        language: script
        types: [text]
        files: \.(py|ts|tsx|js|jsx|sh|yml|yaml)$
        exclude: |
          (?x)^(
            node_modules/.*|
            \.venv/.*|
            venv/.*|
            __pycache__/.*|
            dist/.*|
            build/.*|
            .*\\.min\\.(js|css)$
          )$

  # API Version Validation
  - repo: local
    hooks:
      - id: validate-api-version
        name: Validate API Version
        entry: python scripts/validate-api-version.py
        language: system
        types: [python]
        files: ^(specs/|server/).*\.py$
        stages: [commit]

  # API Contract Validation
  - repo: local
    hooks:
      - id: validate-api-contracts
        name: Validate API Contracts
        entry: python ci/validate-api-contracts.py
        language: system
        pass_filenames: false
        files: '^shared/contracts/.*\.proto$'

  # ---- Rust toolchain hygiene ----
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'cd rust-services/graphops && cargo fmt --all -- --check'
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'cd rust-services/graphops && cargo clippy --all-targets --all-features -- -D warnings'
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: bash -c 'cd rust-services/graphops && cargo test --lib --quiet'
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-audit
        name: cargo audit
        entry: bash -c 'cd rust-services/graphops && cargo audit --deny warnings || echo "  Security audit warnings found - review required"'
        language: system
        files: \.rs$
        pass_filenames: false

  # ---- Go toolchain hygiene ----
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'cd go-services && for dir in grpc-gateway load-tester cli-tools; do echo "Linting $dir..." && cd $dir && golangci-lint run ./... && cd ..; done'
        language: system
        types: [go]
        pass_filenames: false

      - id: goimports
        name: goimports (format)
        entry: bash -c 'cd go-services && for dir in grpc-gateway load-tester cli-tools; do echo "Formatting $dir..." && cd $dir && goimports -w . && cd ..; done'
        language: system
        types: [go]
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy
        entry: bash -c 'cd go-services && for dir in grpc-gateway load-tester cli-tools; do echo "Tidying $dir..." && cd $dir && go mod tidy && cd ..; done'
        language: system
        files: go\.(mod|sum)$
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: bash -c 'cd go-services && for dir in grpc-gateway load-tester cli-tools; do echo "Vetting $dir..." && cd $dir && go vet ./... && cd ..; done'
        language: system
        types: [go]
        pass_filenames: false

  # ---- Root directory cleanliness enforcement ----
  - repo: local
    hooks:
      - id: root-clean
        name: Enforce root directory cleanliness
        entry: .pre-commit-hooks/check-root-clean.sh
        language: script
        pass_filenames: false
        stages: [commit]

  # ---- API Contract Validation (SPEC-100 Task #79) ----
  - repo: local
    hooks:
      - id: validate-contracts
        name: Validate API Contracts
        entry: python ci/validate-api-contracts.py
        language: system
        files: 'shared/contracts/.*\.(yaml|yml)$'
        pass_filenames: false

  # ---- Test Coverage Enforcement ----
  - repo: local
    hooks:
      - id: check-new-files-have-tests
        name: Check New Files Have Tests (Python)
        entry: python scripts/check_test_coverage.py --check-new-files
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
        description: "Ensures newly added Python files have corresponding test files"

      - id: check-multi-lang-tests
        name: Check New Files Have Tests (All Languages)
        entry: python scripts/check_multi_lang_test_coverage.py --check-new-files
        language: system
        types: [python, rust, go]
        pass_filenames: false
        stages: [pre-commit]
        description: "Ensures newly added files (Python, Rust, Go) have corresponding test files"

      - id: check-typescript-tests
        name: Check TypeScript/JavaScript Tests
        entry: python scripts/check_multi_lang_test_coverage.py --check-new-files --language typescript
        language: system
        files: \.(ts|tsx|js|jsx)$
        pass_filenames: false
        stages: [pre-commit]
        description: "Ensures newly added TypeScript/JavaScript files have corresponding test files"

  # ---- Optional: Add more hooks below ----
