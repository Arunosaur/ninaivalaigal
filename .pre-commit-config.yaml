default_language_version:
  python: python3

# Minimal exclusions - only build artifacts, external dependencies, third-party vendor code, and backup files
exclude: |
  (?x)^(
    external/spec-013/.*|
    vscode-client/dist/.*|
    vscode-client/node_modules/.*|
    node_modules/.*|
    client-tools/vendor/.*|
    .*_backup\.py$|
    .*\.lock$|
    .*__pycache__.*|
    .*\.pyc$
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-added-large-files
        args: ['--maxkb=5000']
        exclude: 'package-lock\.json$'
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        additional_dependencies: [flake8-docstrings, flake8-bugbear]
        exclude: |
          (?x)^(
            client-tools/vendor/.*|
            external/spec-013/.*|
            vscode-client/.*|
            node_modules/.*|
            .*_pb2\.py$|
            .*_pb2_grpc\.py$|
            .*/benchmarks/.*\.py$|
            ci/.*\.py$
          )$

  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.7.1
  #   hooks:
  #     - id: mypy
  #       additional_dependencies: [types-requests, types-redis, types-python-dateutil]
  #       args: [--ignore-missing-imports, --no-strict-optional]
  #       exclude: ^(client-tools/mem0|client-tools/eM|sidecar/main\.py|mcp_server/main\.py)$
  #   # Note: Temporarily disabled due to duplicate module name issues across codebase
  #   # Will be re-enabled once module naming conflicts are resolved

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: ["-c", ".bandit", "-r", "server/"]
        files: ^server/.*\.py$

  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        files: ^scripts/.*\.sh$
        args: ["--severity=warning"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: scripts/restart-api-with-latest-code.sh

  # SPDX License Header Validation
  - repo: local
    hooks:
      - id: check-spdx-headers
        name: Check SPDX License Headers
        entry: .pre-commit-hooks/check-spdx-headers.sh
        language: script
        types: [text]
        files: \.(py|ts|tsx|js|jsx|sh|yml|yaml)$
        exclude: |
          (?x)^(
            node_modules/.*|
            \.venv/.*|
            venv/.*|
            __pycache__/.*|
            dist/.*|
            build/.*|
            .*\\.min\\.(js|css)$
          )$

  # API Version Validation
  - repo: local
    hooks:
      - id: validate-api-version
        name: Validate API Version
        entry: python scripts/validate-api-version.py
        language: system
        types: [python]
        files: ^(specs/|server/).*\.py$
        stages: [commit]

  # API Contract Validation
  - repo: local
    hooks:
      - id: validate-api-contracts
        name: Validate API Contracts
        entry: python ci/validate-api-contracts.py
        language: system
        pass_filenames: false
        files: '^shared/contracts/.*\.proto$'

  # ---- Rust toolchain hygiene ----
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'cd rust-services/graphops && cargo fmt --all -- --check'
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'cd rust-services/graphops && cargo clippy --all-targets --all-features -- -D warnings'
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: bash -c 'cd rust-services/graphops && cargo test --lib --quiet'
        language: system
        files: \.rs$
        pass_filenames: false
