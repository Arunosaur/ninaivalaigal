<!DOCTYPE html>
<html>
<head>
    <title>Test Staff Login</title>
</head>
<body>
    <h1>Staff Login Test</h1>
    <button onclick="testLogin()">Test Login</button>
    <pre id="result"></pre>

    <script>
        const API_URL = 'http://localhost:13370';

        async function testLogin() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Testing...';

            try {
                console.log('Calling:', `${API_URL}/auth/staff/login`);

                const response = await fetch(`${API_URL}/auth/staff/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@ninaivalaigal.com',
                        password: 'ChangeMe123!@#'
                    })
                });

                console.log('Response status:', response.status);
                console.log('Response ok:', response.ok);

                const data = await response.json();
                console.log('Response data:', data);

                resultEl.textContent = `Status: ${response.status}\n\n` + JSON.stringify(data, null, 2);

                if (response.ok && data.access_token) {
                    resultEl.textContent += '\n\n✅ LOGIN SUCCESSFUL!';
                } else {
                    resultEl.textContent += '\n\n❌ LOGIN FAILED';
                }
            } catch (error) {
                console.error('Error:', error);
                resultEl.textContent = `Error: ${error.message}\n\n${error.stack}`;
            }
        }
    </script>
</body>
</html>
