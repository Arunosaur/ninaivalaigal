# Simple, proven PostgreSQL + PgBouncer + Redis setup
# No custom images, no complexity - just standard Docker images that work

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nina-postgres
    environment:
      POSTGRES_DB: ninaivalaigal_dev
      POSTGRES_USER: nina
      POSTGRES_PASSWORD: dev_password_change_in_production
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nina"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: nina-pgbouncer
    environment:
      DATABASE_URL: "postgres://nina:dev_password_change_in_production@postgres:5432/ninaivalaigal_dev"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 3
    ports:
      - "6442:5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nina-redis
    command: redis-server --requirepass dev_redis_password --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6389:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
