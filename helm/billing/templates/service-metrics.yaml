{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "billing.fullname" . }}-metrics
  labels:
    {{- include "billing.labels" . | nindent 4 }}
    component: metrics
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.prometheus.port }}
    targetPort: {{ .Values.prometheus.port }}
    protocol: TCP
    name: metrics
  selector:
    {{- include "billing.selectorLabels" . | nindent 4 }}
{{- end }}
