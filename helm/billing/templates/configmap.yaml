apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "billing.fullname" . }}-config
  labels:
    {{- include "billing.labels" . | nindent 4 }}
data:
  celery.conf: |
    broker_url={{ .Values.env | selectattr("name", "equalto", "REDIS_URL") | map(attribute="value") | first | default "redis://localhost:6379/0" }}
    result_backend={{ .Values.env | selectattr("name", "equalto", "REDIS_URL") | map(attribute="value") | first | default "redis://localhost:6379/0" }}
    task_serializer=json
    accept_content=["json"]
    result_serializer=json
    timezone=UTC
    enable_utc=True
    task_acks_late=True
    worker_prefetch_multiplier=4
    worker_max_tasks_per_child=1000
