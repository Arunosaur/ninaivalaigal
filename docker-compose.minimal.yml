version: '3.8'

services:
  # Minimal Redis with unified password auth
  redis:
    image: redis:7-alpine
    container_name: ninaivalaigal-minimal-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PASSWORD=secure_nina_password
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "secure_nina_password", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ninaivalaigal-minimal

  # Minimal API with basic FastAPI
  api:
    build:
      context: .
      dockerfile: Dockerfile.minimal
    container_name: ninaivalaigal-minimal-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=secure_nina_password
      - REDIS_DB=0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ninaivalaigal-minimal
    volumes:
      - ./server:/app/server:ro
      - ./run_server_minimal.py:/app/run_server.py:ro

networks:
  ninaivalaigal-minimal:
    driver: bridge
