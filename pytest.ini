[pytest]
pythonpath = .
testpaths = tests server/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
norecursedirs = tests/templates
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -m unit
markers =
    unit: Fast tests with in-memory dependencies only
    integration: Requires backing services such as Postgres or Redis
    e2e: Full-stack journey tests hitting HTTP gateways and auth flows
    functional: Scenario coverage that may span multiple modules
    performance: Benchmark and load tests
    slow: Tests that are expected to exceed one second
    security: Security-focused tests
    chaos: Chaos engineering and failure simulation tests
    rust_integration: Tests that exercise the Rust memory provider integration
    agentic: Agentic workflow scenarios including hybrid signup flows
