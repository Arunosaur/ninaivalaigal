[alembic]
# Path to migration scripts (relative to this file)
script_location = %(here)s

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour)d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
# timezone =

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file
# sourceless = false

# Version location specification
# version_locations = %(here)s/bar:%(here)s/bat:versions

# Version path separator
version_path_separator = os

# Output encoding used when revision files are written
# output_encoding = utf-8

# Database URL
# This is a fallback for local dev only. Production/Test should use environment variables:
# - NINAIVALAIGAL_DATABASE_URL (preferred)
# - DATABASE_URL (fallback)
# Format: postgresql://user:password@host:port/database
sqlalchemy.url = postgresql://nina:dev_password_change_in_production@localhost:5452/ninaivalaigal_dev

[post_write_hooks]
# Post-write hooks for newly generated revision scripts
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 120 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
