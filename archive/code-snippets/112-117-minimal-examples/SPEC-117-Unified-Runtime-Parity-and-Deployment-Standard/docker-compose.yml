version: "3.9"
services:
  api:
    build: .
    image: ghcr.io/medhasys/ninaivalaigal-api:dev
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - dev-ninaivalaigal-net
  ui:
    build:
      context: ./apps/ui
    image: ghcr.io/medhasys/ninaivalaigal-ui:dev
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - dev-ninaivalaigal-net
networks:
  dev-ninaivalaigal-net: {}
