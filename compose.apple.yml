version: '3.8'

services:
  postgres:
    image: postgres:15.8
    platform: linux/arm64
    container_name: ninaivalaigal-apple-${NINA_ENV:-dev}-db
    environment:
      POSTGRES_DB: ninaivalaigal_${NINA_ENV:-dev}
      POSTGRES_USER: nina
      POSTGRES_PASSWORD: ${NINA_DB_PASSWORD:-secure_nina_password}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "${POSTGRES_PORT:-5452}:5432"
    volumes:
      - ./data/postgres_${NINA_ENV:-dev}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nina -d ninaivalaigal_${NINA_ENV:-dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4.0-alpine
    platform: linux/arm64
    container_name: ninaivalaigal-apple-${NINA_ENV:-dev}-redis
    ports:
      - "${REDIS_PORT:-6399}:6379"
    environment:
      REDIS_PASSWORD: ${NINA_REDIS_PASSWORD:-secure_nina_password}
    command: redis-server --requirepass ${NINA_REDIS_PASSWORD:-secure_nina_password} --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - ./data/redis_${NINA_ENV:-dev}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${NINA_REDIS_PASSWORD:-secure_nina_password}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      platforms:
        - linux/arm64
    platform: linux/arm64
    container_name: ninaivalaigal-apple-${NINA_ENV:-dev}-api
    command: ["python", "run_server.py"]
    ports:
      - "${API_PORT:-13390}:8000"
    environment:
      NINAIVALAIGAL_DATABASE_URL: postgresql://nina:${NINA_DB_PASSWORD:-secure_nina_password}@postgres:5432/ninaivalaigal_${NINA_ENV:-dev}
      NINAIVALAIGAL_JWT_SECRET: ${NINA_JWT_SECRET:-dev_jwt_secret}
      NINAIVALAIGAL_DEBUG: "1"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${NINA_REDIS_PASSWORD:-secure_nina_password}
      REDIS_DB: 0
      PYTHONPATH: /app/server
      PORT: 8000
      UVICORN_RELOAD: "0"
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app/server:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    platform: linux/arm64
    container_name: ninaivalaigal-apple-${NINA_ENV:-dev}-ui
    ports:
      - "${UI_PORT:-8101}:8081"
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:${API_PORT:-13390}
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    name: ninaivalaigal_apple_${NINA_ENV:-dev}_network
