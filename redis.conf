# Redis Configuration for ninaivalaigal development
# Unified password authentication (no ACL complexity)

# Basic security
requirepass secure_nina_password

# Network settings
bind 0.0.0.0
port 6379
protected-mode no

# Memory settings
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence (minimal for dev)
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice

# Disable ACL for simplicity in dev environment
# This ensures redis-py works with just password authentication
