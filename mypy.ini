# MyPy Configuration - Incremental Type Safety
# Strategy: Gradual adoption with progressive strictness
# Current errors: ~1,103 (target: <100 in 4 weeks)

[mypy]
python_version = 3.11
warn_return_any = False
warn_unused_configs = True

# Phase 1: Lenient (current)
disallow_untyped_defs = False
disallow_incomplete_defs = True
ignore_missing_imports = True

# Type checking options
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True

# Strictness progression (uncomment as you fix errors)
# Phase 2: disallow_untyped_defs = True
# Phase 3: disallow_any_generics = True
# Phase 4: strict = True

# Test directories (always ignored)
[mypy-tests.*]
ignore_errors = True

[mypy-scripts.*]
ignore_errors = True

# MCP server (external, separate typing strategy)
[mypy-mcp_server.*]
ignore_errors = True

# Redis modules (needs async typing fixes)
[mypy-server.redis_queue]
ignore_errors = True

[mypy-server.redis_client]
ignore_errors = True

# Phase 1 Target Modules (add types first)
# Uncomment these as you add type hints:
