name: GraphOps Performance

on:
  push:
    branches: [main, develop]
    paths:
      - 'rust-services/graphops/**'
      - 'shared/contracts/graphops/**'
      - 'benchmarks/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'rust-services/graphops/**'
      - 'shared/contracts/graphops/**'
      - 'benchmarks/**'
  workflow_dispatch:  # Allow manual triggering

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nina
          POSTGRES_PASSWORD: test_password  # pragma: allowlist secret
          POSTGRES_DB: ninaivalaigal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-services/graphops

      - name: Install Apache AGE extension
        run: |  # pragma: allowlist secret
          sudo apt-get update
          sudo apt-get install -y postgresql-15-age
          PGPASSWORD=test_password psql -h localhost -U nina -d ninaivalaigal_test -c "CREATE EXTENSION IF NOT EXISTS age;"  # pragma: allowlist secret

      - name: Setup database schema
