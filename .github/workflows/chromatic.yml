# Chromatic Visual Regression Testing
# Runs on every push to detect visual changes in components

name: Chromatic

# ⚠️ DEPRECATED: This workflow is disabled because frontend-nextjs has been archived
# See: .archive/deprecated/frontend-nextjs-2025-01-31/

on:
  workflow_dispatch:  # Manual trigger only - disabled for automatic runs
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'frontend-nextjs/src/**'  # DEPRECATED - folder archived
  #     - 'frontend-nextjs/.storybook/**'  # DEPRECATED - folder archived
  # pull_request:
  #   paths:
  #     - 'frontend-nextjs/src/**'  # DEPRECATED - folder archived
  #     - 'frontend-nextjs/.storybook/**'  # DEPRECATED - folder archived

jobs:
  chromatic:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-nextjs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for Chromatic baseline detection

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Chromatic
        uses: chromaui/action@v1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: frontend-nextjs
          buildScriptName: build-storybook
          exitZeroOnChanges: true
          autoAcceptChanges: main  # Auto-accept on main branch
