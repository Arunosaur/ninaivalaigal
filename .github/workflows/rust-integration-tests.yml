name: 🦀 Rust Integration Tests

on:
  schedule:
    # Run nightly at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      run_all_tests:
        description: 'Run all Rust integration tests'
        required: false
        default: 'true'
        type: boolean
  push:
    branches: [main, develop]
    paths:
      - 'server/memory/**'
      - 'rust-services/**'
      - 'tests/integration/test_memory_service_rust*.py'
      - '.github/workflows/rust-integration-tests.yml'

env:
  PYTHON_VERSION: '3.11'
  RUST_VERSION: '1.75'
  MEMORY_SERVICE_URL: 'http://localhost:13393'
  TEST_API_BASE_URL: 'http://localhost:13390'

jobs:
  rust-integration-tests:
    name: 🦀 Rust Memory Service Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: nina
          POSTGRES_PASSWORD: test_password_123  # pragma: allowlist secret
          POSTGRES_DB: ninaivalaigal_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🦀 Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          profile: minimal
          components: rustfmt, clippy
          override: true

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-html pytest-xdist httpx requests

      - name: 🗄️ Set up database
        run: |
          # Wait for PostgreSQL to be ready
          until pg_isready -h localhost -p 5432 -U nina; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          # Create test database if it doesn't exist
          PGPASSWORD=test_password_123 createdb -h localhost -U nina ninaivalaigal_test || true

          # Run migrations if needed
          if [ -f alembic.ini ]; then
            echo "Running database migrations..."
            export DATABASE_URL=postgresql://nina:test_password_123@localhost:5432/ninaivalaigal_test
            alembic upgrade head || echo "Migrations skipped or failed"
          fi

      - name: 🏗️ Build Rust Memory Service
        working-directory: rust-services/memory-service
        run: |
          echo "Building Rust Memory Service..."
          cargo build --release
          echo "✅ Build complete"

      - name: 🚀 Start Rust Memory Service
        env:
          DATABASE_URL: postgresql://nina:test_password_123@localhost:5432/ninaivalaigal_test
          REDIS_URL: redis://localhost:6379/0
          NINAIVALAIGAL_JWT_SECRET: test_jwt_secret_for_ci  # pragma: allowlist secret
          NINA_ENV: test
          RUST_LOG: info
        run: |
          echo "Starting Rust Memory Service..."
          cd rust-services/memory-service
          cargo run --release &
          RUST_PID=$!
          echo $RUST_PID > /tmp/rust_memory_service.pid

          # Wait for service to be ready
          echo "Waiting for Rust Memory Service to be ready..."
          timeout 120 bash -c 'until curl -f http://localhost:13393/health 2>/dev/null; do sleep 2; done' || {
            echo "❌ Rust Memory Service failed to start"
            if [ -f /tmp/rust_memory_service.pid ]; then
              kill $(cat /tmp/rust_memory_service.pid) 2>/dev/null || true
            fi
            exit 1
          }
          echo "✅ Rust Memory Service is ready"

      - name: 🚀 Start Core API Server (for JWT tokens)
        env:
          DATABASE_URL: postgresql://nina:test_password_123@localhost:5432/ninaivalaigal_test
          REDIS_URL: redis://localhost:6379/0
          NINAIVALAIGAL_JWT_SECRET: test_jwt_secret_for_ci  # pragma: allowlist secret
          USE_RUST_MEMORY: '1'
          MEMORY_SERVICE_URL: ${{ env.MEMORY_SERVICE_URL }}
        run: |
          echo "Starting Core API Server..."
          cd server
          python -m uvicorn main:app --host 0.0.0.0 --port 13390 &
          API_PID=$!
          echo $API_PID > /tmp/core_api_server.pid

          # Wait for API to be ready
          echo "Waiting for Core API to be ready..."
          timeout 120 bash -c 'until curl -f http://localhost:13390/health 2>/dev/null; do sleep 2; done' || {
            echo "❌ Core API Server failed to start"
            if [ -f /tmp/core_api_server.pid ]; then
              kill $(cat /tmp/core_api_server.pid) 2>/dev/null || true
            fi
            exit 1
          }
          echo "✅ Core API Server is ready"

      - name: 🧪 Run Rust Integration Tests
        id: rust_tests
        env:
          PYTEST_RUN_RUST_INTEGRATION: '1'
          USE_RUST_MEMORY: '1'
          MEMORY_SERVICE_URL: ${{ env.MEMORY_SERVICE_URL }}
          CORE_API_URL: ${{ env.TEST_API_BASE_URL }}
          DATABASE_URL: postgresql://nina:test_password_123@localhost:5432/ninaivalaigal_test
          REDIS_URL: redis://localhost:6379/0
          NINAIVALAIGAL_JWT_SECRET: test_jwt_secret_for_ci  # pragma: allowlist secret
        run: |
          echo "🧪 Running Rust Integration Tests..."
          echo "PYTEST_RUN_RUST_INTEGRATION=$PYTEST_RUN_RUST_INTEGRATION"
          echo "USE_RUST_MEMORY=$USE_RUST_MEMORY"

          # Run Rust integration tests
          pytest tests/integration/test_memory_service_rust.py \
                 tests/integration/test_memory_service_rust_standalone.py \
                 -v \
                 --tb=short \
                 --junit-xml=rust-integration-test-results.xml \
                 --html=rust-integration-test-report.html \
                 --self-contained-html \
                 --run-rust-integration \
                 || TEST_EXIT_CODE=$?

          # Check if tests passed
          if [ -f rust-integration-test-results.xml ]; then
            FAILURES=$(grep -o 'failures="[0-9]*"' rust-integration-test-results.xml | grep -o '[0-9]*' | head -1 || echo "0")
            ERRORS=$(grep -o 'errors="[0-9]*"' rust-integration-test-results.xml | grep -o '[0-9]*' | head -1 || echo "0")
            TOTAL_FAILURES=$((FAILURES + ERRORS))

            if [ "$TOTAL_FAILURES" -eq 0 ]; then
              echo "✅ All Rust integration tests passed"
              echo "rust_tests_passed=true" >> $GITHUB_OUTPUT
            else
              echo "❌ Rust integration tests failed: $TOTAL_FAILURES failures/errors"
              echo "rust_tests_passed=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          else
            echo "⚠️ Test results file not found"
            exit 1
          fi

      - name: 🛑 Stop services
        if: always()
        run: |
          echo "Stopping services..."
          if [ -f /tmp/rust_memory_service.pid ]; then
            kill $(cat /tmp/rust_memory_service.pid) 2>/dev/null || true
            rm /tmp/rust_memory_service.pid
          fi
          if [ -f /tmp/core_api_server.pid ]; then
            kill $(cat /tmp/core_api_server.pid) 2>/dev/null || true
            rm /tmp/core_api_server.pid
          fi

      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-integration-test-results-${{ github.run_number }}
          path: |
            rust-integration-test-results.xml
            rust-integration-test-report.html

      - name: 📈 Generate test summary
        if: always()
        run: |
          echo "## 🦀 Rust Integration Tests Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f rust-integration-test-results.xml ]; then
            echo "### Test Execution Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Extract test statistics from JUnit XML
            TOTAL_TESTS=$(grep -o 'tests="[0-9]*"' rust-integration-test-results.xml | grep -o '[0-9]*' | head -1 || echo "0")
            FAILURES=$(grep -o 'failures="[0-9]*"' rust-integration-test-results.xml | grep -o '[0-9]*' | head -1 || echo "0")
            ERRORS=$(grep -o 'errors="[0-9]*"' rust-integration-test-results.xml | grep -o '[0-9]*' | head -1 || echo "0")
            PASSED=$((TOTAL_TESTS - FAILURES - ERRORS))

            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total Tests | $TOTAL_TESTS |" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | ✅ $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | ❌ $FAILURES |" >> $GITHUB_STEP_SUMMARY
            echo "| Errors | ⚠️ $ERRORS |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "$FAILURES" -eq 0 ] && [ "$ERRORS" -eq 0 ]; then
              echo "🎉 **All Rust integration tests passed!**" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **Some tests failed. Please review the test results.**" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ Test results file not found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 💬 Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let comment = '## 🦀 Rust Integration Tests Results\n\n';

            if (fs.existsSync('rust-integration-test-results.xml')) {
              const xml = fs.readFileSync('rust-integration-test-results.xml', 'utf8');

              // Extract test statistics
              const totalMatch = xml.match(/tests="(\d+)"/);
              const failuresMatch = xml.match(/failures="(\d+)"/);
              const errorsMatch = xml.match(/errors="(\d+)"/);

              const total = totalMatch ? parseInt(totalMatch[1]) : 0;
              const failures = failuresMatch ? parseInt(failuresMatch[1]) : 0;
              const errors = errorsMatch ? parseInt(errorsMatch[1]) : 0;
              const passed = total - failures - errors;

              comment += `### Test Execution Summary\n\n`;
              comment += `| Metric | Count |\n`;
              comment += `|--------|-------|\n`;
              comment += `| Total Tests | ${total} |\n`;
              comment += `| ✅ Passed | ${passed} |\n`;
              comment += `| ❌ Failed | ${failures + errors} |\n\n`;

              if (failures === 0 && errors === 0) {
                comment += `🎉 **All Rust integration tests passed!**\n\n`;
              } else {
                comment += `❌ **Some tests failed.** Please review the test results in the workflow artifacts.\n\n`;
              }
            } else {
              comment += '⚠️ Test results not available. Check workflow logs for details.\n';
            }

            comment += '\n\n---\n*This comment was automatically generated by the Rust Integration Tests workflow.*';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: 🚨 Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '❌ Rust Integration Tests Failed',
              body: `Rust integration tests failed in ${context.workflow}.\n\nRun: ${context.runNumber}\nCommit: ${context.sha}\n\nCheck artifacts for detailed report.`,
              labels: ['testing', 'rust', 'integration', 'automated']
            })
