name: 🏗️ Infrastructure Deployment

on:
  workflow_dispatch:
    inputs:
      cloud_provider:
        description: 'Cloud provider to deploy to'
        required: true
        default: 'aws'
        type: choice
        options:
        - aws
        - gcp
        - azure
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
        - plan
        - apply
        - destroy

jobs:
  terraform:
    runs-on: ubuntu-latest
    name: Terraform ${{ github.event.inputs.action }} on ${{ github.event.inputs.cloud_provider }}

    steps:
      - name: 📋 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: 🔐 Configure AWS credentials
        if: github.event.inputs.cloud_provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: 🔐 Authenticate to Google Cloud
        if: github.event.inputs.cloud_provider == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 🔐 Azure Login
        if: github.event.inputs.cloud_provider == 'azure'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🏗️ Terraform Init
        run: |
          cd terraform/${{ github.event.inputs.cloud_provider }}
          terraform init

      - name: ✅ Validate Terraform Configuration
        if: github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply'
        run: |
          bash terraform/scripts/validate-${{ github.event.inputs.cloud_provider }}.sh

      - name: 📋 Terraform Plan
        if: github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply'
        run: |
          cd terraform/${{ github.event.inputs.cloud_provider }}
          terraform plan -out=tfplan

      - name: 🚀 Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: |
          cd terraform/${{ github.event.inputs.cloud_provider }}
          terraform apply tfplan

      - name: 🧪 Run Health Checks
        if: github.event.inputs.action == 'apply'
        run: |
          bash terraform/scripts/test-${{ github.event.inputs.cloud_provider }}.sh || echo "⚠️  Health checks failed - deployment may still be in progress"

      - name: 🗑️ Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          cd terraform/${{ github.event.inputs.cloud_provider }}
          terraform destroy -auto-approve

      - name: 📊 Output Results
        if: github.event.inputs.action == 'apply'
        run: |
          cd terraform/${{ github.event.inputs.cloud_provider }}
          terraform output
          echo ""
          echo "🌐 Deployment URLs:"
          if [ "${{ github.event.inputs.cloud_provider }}" = "aws" ]; then
            terraform output -raw load_balancer_dns 2>/dev/null | sed 's/^/  ALB URL: http:\/\//' || echo "  ALB URL: Not available"
          elif [ "${{ github.event.inputs.cloud_provider }}" = "gcp" ]; then
            terraform output -raw service_url 2>/dev/null | sed 's/^/  Cloud Run URL: /' || echo "  Cloud Run URL: Not available"
          elif [ "${{ github.event.inputs.cloud_provider }}" = "azure" ]; then
            terraform output -raw container_group_fqdn 2>/dev/null | sed 's/^/  Container URL: http:\/\//' || terraform output -raw container_group_ip 2>/dev/null | sed 's/^/  Container URL: http:\/\//' || echo "  Container URL: Not available"
          fi
