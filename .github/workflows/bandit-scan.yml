name: Security Scan (Bandit)

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/**/*.py'
      - '.bandit'
      - '.github/workflows/bandit-scan.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'server/**/*.py'
      - '.bandit'
  schedule:
    # Run weekly security scan on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  bandit-security-scan:
    name: Bandit Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]==1.8.0

      - name: Run Bandit Security Scan
        id: bandit
        run: |
          echo "🔒 Running Bandit security scan..."
          bandit -c .bandit -r server/ -f json -o bandit-report.json || true
          bandit -c .bandit -r server/ -f txt -o bandit-report.txt || true

          # Extract metrics
          TOTAL_ISSUES=$(python -c "import json; data = json.load(open('bandit-report.json')); print(len(data['results']))")
          HIGH_ISSUES=$(python -c "import json; data = json.load(open('bandit-report.json')); print(data['metrics']['_totals']['SEVERITY.HIGH'])")
          MEDIUM_ISSUES=$(python -c "import json; data = json.load(open('bandit-report.json')); print(data['metrics']['_totals']['SEVERITY.MEDIUM'])")
          LOW_ISSUES=$(python -c "import json; data = json.load(open('bandit-report.json')); print(data['metrics']['_totals']['SEVERITY.LOW'])")

          echo "total_issues=$TOTAL_ISSUES" >> $GITHUB_OUTPUT
          echo "high_issues=$HIGH_ISSUES" >> $GITHUB_OUTPUT
          echo "medium_issues=$MEDIUM_ISSUES" >> $GITHUB_OUTPUT
          echo "low_issues=$LOW_ISSUES" >> $GITHUB_OUTPUT

          echo "## 🔒 Bandit Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 HIGH | $HIGH_ISSUES |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 MEDIUM | $MEDIUM_ISSUES |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 LOW | $LOW_ISSUES |" >> $GITHUB_STEP_SUMMARY
          echo "| **TOTAL** | **$TOTAL_ISSUES** |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Bandit Report (JSON)
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report-json
          path: bandit-report.json
          retention-days: 90

      - name: Upload Bandit Report (Text)
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report-txt
          path: bandit-report.txt
          retention-days: 90

      - name: Check Security Threshold
        run: |
          HIGH=${{ steps.bandit.outputs.high_issues }}
          MEDIUM=${{ steps.bandit.outputs.medium_issues }}

          echo "🔍 Security Threshold Check:"
          echo "  HIGH severity issues: $HIGH (threshold: 0)"
          echo "  MEDIUM severity issues: $MEDIUM (threshold: 0)"

          if [ "$HIGH" -gt 0 ]; then
            echo "❌ FAILED: $HIGH HIGH severity security issues found!"
            exit 1
          fi

          if [ "$MEDIUM" -gt 0 ]; then
            echo "⚠️  WARNING: $MEDIUM MEDIUM severity issues found (not blocking)"
          fi

          echo "✅ PASSED: No HIGH severity security issues detected"

      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const high = '${{ steps.bandit.outputs.high_issues }}';
            const medium = '${{ steps.bandit.outputs.medium_issues }}';
            const low = '${{ steps.bandit.outputs.low_issues }}';
            const total = '${{ steps.bandit.outputs.total_issues }}';

            const status = high > 0 ? '❌ FAILED' : '✅ PASSED';
            const emoji = high > 0 ? '🔴' : '🟢';

            const body = `## ${emoji} Bandit Security Scan ${status}

            | Severity | Count |
            |----------|-------|
            | 🔴 HIGH | ${high} |
            | 🟡 MEDIUM | ${medium} |
            | 🔵 LOW | ${low} |
            | **TOTAL** | **${total}** |

            ${high > 0 ? '⚠️ **Action Required**: HIGH severity issues must be resolved before merge.' : '✅ No HIGH severity issues detected.'}

            [View detailed report in workflow artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
