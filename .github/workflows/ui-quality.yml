name: Frontend Quality Checks

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend-nextjs/**'
      - '.github/workflows/ui-quality.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend-nextjs/**'
  workflow_dispatch:

jobs:
  lint-and-format:
    name: ESLint & Prettier
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-nextjs/package-lock.json

      - name: Install dependencies
        working-directory: frontend-nextjs
        run: npm ci

      - name: Run ESLint
        working-directory: frontend-nextjs
        run: npm run lint

      - name: Comment PR with lint results
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **ESLint/Prettier checks failed**\n\nPlease run `npm run lint:fix` and `npm run format` locally, then commit the changes.'
            });

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-nextjs/package-lock.json

      - name: Install dependencies
        working-directory: frontend-nextjs
        run: npm ci

      - name: Type check
        working-directory: frontend-nextjs
        run: npm run type-check

  test-coverage:
    name: Jest Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-nextjs/package-lock.json

      - name: Install dependencies
        working-directory: frontend-nextjs
        run: npm ci

      - name: Run tests with coverage
        working-directory: frontend-nextjs
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend-nextjs/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

      - name: Check coverage thresholds
        working-directory: frontend-nextjs
        run: |
          COVERAGE=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json')).total.lines.pct")
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Coverage below 80% threshold"
            exit 1
          fi
          echo "✅ Coverage meets 80% threshold"

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-nextjs/package-lock.json

      - name: Install dependencies
        working-directory: frontend-nextjs
        run: npm ci

      - name: Build
        working-directory: frontend-nextjs
        run: npm run build

      - name: Analyze bundle size
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const buildDir = path.join(process.cwd(), 'frontend-nextjs', '.next');

            if (!fs.existsSync(buildDir)) {
              console.log('Build directory not found, skipping bundle analysis');
              return;
            }

            // Calculate total bundle size
            let totalSize = 0;
            const files = fs.readdirSync(path.join(buildDir, 'static'));

            console.log('📦 Bundle Analysis:');
            console.log('==================');

            // This is a simplified analysis - in production you'd use @next/bundle-analyzer
            const maxSize = 500 * 1024; // 500KB threshold

            console.log(`Total size: ${(totalSize / 1024).toFixed(2)} KB`);
            console.log(`Threshold: ${(maxSize / 1024).toFixed(2)} KB`);

            if (totalSize > maxSize) {
              core.setFailed('Bundle size exceeds 500KB threshold');
            }

  storybook-build:
    name: Storybook Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-nextjs/package-lock.json

      - name: Install dependencies
        working-directory: frontend-nextjs
        run: npm ci

      - name: Build Storybook
        working-directory: frontend-nextjs
        run: npm run build-storybook

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check, test-coverage, bundle-size, storybook-build]
    if: always()

    steps:
      - name: Generate summary
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = [
              { name: 'ESLint & Prettier', result: '${{ needs.lint-and-format.result }}' },
              { name: 'TypeScript', result: '${{ needs.type-check.result }}' },
              { name: 'Tests & Coverage', result: '${{ needs.test-coverage.result }}' },
              { name: 'Bundle Size', result: '${{ needs.bundle-size.result }}' },
              { name: 'Storybook', result: '${{ needs.storybook-build.result }}' }
            ];

            const passed = jobs.filter(j => j.result === 'success').length;
            const failed = jobs.filter(j => j.result === 'failure').length;
            const status = failed === 0 ? '✅ PASSED' : '❌ FAILED';

            const summary = `## 🎯 Frontend Quality Summary ${status}

            | Check | Status |
            |-------|--------|
            ${jobs.map(j => `| ${j.name} | ${j.result === 'success' ? '✅' : '❌'} |`).join('\n')}

            **Results**: ${passed}/${jobs.length} checks passed
            `;

            console.log(summary);

            if (context.eventName === 'pull_request') {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            }

            if (failed > 0) {
              core.setFailed(`${failed} quality checks failed`);
            }
