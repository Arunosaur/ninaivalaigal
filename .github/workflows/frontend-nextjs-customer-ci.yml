name: Frontend Next.js Customer CI

# ⚠️ DEPRECATED: This workflow is disabled because frontend-nextjs-customer has been archived
# See: .archive/deprecated/frontend-nextjs-customer-2025-01-31/
# Active frontend: apps/customer/ (Vite + React Router)

on:
  workflow_dispatch:  # Manual trigger only - disabled for automatic runs
  # push:
  #   paths:
  #     - 'frontend-nextjs-customer/**'  # DEPRECATED - folder archived
  # pull_request:
  #   paths:
  #     - 'frontend-nextjs-customer/**'  # DEPRECATED - folder archived

permissions:
  contents: read
  actions: read
  checks: write
  statuses: write

jobs:
  test:
    name: Lint, Unit, Coverage, E2E
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    defaults:
      run:
        working-directory: frontend-nextjs-customer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-nextjs-customer/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest with coverage
        run: npm run test:coverage

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-nextjs-customer-coverage
          path: frontend-nextjs-customer/coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests
        run: npm run test:e2e
