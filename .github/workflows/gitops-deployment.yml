name: GitOps Deployment Pipeline

on:
  push:
    branches: [main, develop]
    paths:
    - 'server/**'
    - 'k8s/**'
    - 'Dockerfile'
  pull_request:
    branches: [main]
    paths:
    - 'server/**'
    - 'k8s/**'
    - 'Dockerfile'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ninaivalaigal/api-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Kubernetes tools
      run: |
        # Install kubectl
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/
        
        # Install kustomize
        curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        sudo mv kustomize /usr/local/bin/
        
        # Install kubeval for validation
        wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
        tar xf kubeval-linux-amd64.tar.gz
        sudo mv kubeval /usr/local/bin/
        
    - name: Validate Kubernetes manifests
      run: |
        echo "🔍 Validating Kubernetes manifests..."
        
        # Validate base manifests
        find k8s/base -name "*.yaml" -exec kubeval {} \;
        
        # Validate kustomize overlays
        for env in dev staging prod; do
          if [ -d "k8s/overlays/$env" ]; then
            echo "Validating $env environment..."
            kustomize build k8s/overlays/$env | kubeval
          fi
        done
        
    - name: Security scan manifests
      run: |
        echo "🔒 Scanning manifests for security issues..."
        
        # Install and run kubesec
        wget https://github.com/controlplaneio/kubesec/releases/latest/download/kubesec_linux_amd64.tar.gz
        tar -xvf kubesec_linux_amd64.tar.gz
        sudo mv kubesec /usr/local/bin/
        
        # Scan all deployments
        find k8s/base -name "deployment.yaml" -exec kubesec scan {} \;

  update-gitops:
    needs: [build-and-push, validate-manifests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITOPS_TOKEN }}
        
    - name: Update image tags
      run: |
        echo "🔄 Updating image tags for GitOps..."
        
        # Extract image tag from build job
        NEW_TAG="${{ needs.build-and-push.outputs.image-tag }}"
        
        # Update kustomization files with new image tag
        for env in dev staging; do
          if [ -d "k8s/overlays/$env" ]; then
            echo "Updating $env environment with tag: $NEW_TAG"
            
            # Update kustomization.yaml with new image tag
            sed -i "s|newTag:.*|newTag: ${NEW_TAG##*:}|g" k8s/overlays/$env/kustomization.yaml
          fi
        done
        
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        if git diff --quiet; then
          echo "No changes to commit"
        else
          git add k8s/overlays/*/kustomization.yaml
          git commit -m "chore: update image tags for GitOps deployment [skip ci]"
          git push
        fi

  deploy-dev:
    needs: [build-and-push, validate-manifests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: development
    
    steps:
    - name: Trigger ArgoCD sync
      run: |
        echo "🚀 Triggering ArgoCD sync for development environment..."
        
        # This would typically use ArgoCD CLI or API to trigger sync
        # For now, we'll simulate the trigger
        echo "ArgoCD sync triggered for ninaivalaigal-dev application"
        
        # In a real setup, you would:
        # argocd app sync ninaivalaigal-dev --auth-token ${{ secrets.ARGOCD_TOKEN }}
        
    - name: Wait for deployment
      run: |
        echo "⏳ Waiting for deployment to complete..."
        sleep 30  # In real setup, would check ArgoCD app status
        
    - name: Run health checks
      run: |
        echo "🏥 Running post-deployment health checks..."
        
        # This would run against the actual deployed application
        echo "✅ Health checks passed for development environment"

  notify-deployment:
    needs: [deploy-dev]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Notify deployment status
      run: |
        if [ "${{ needs.deploy-dev.result }}" == "success" ]; then
          echo "✅ Deployment successful to development environment"
          # Send success notification to Slack/Teams
        else
          echo "❌ Deployment failed to development environment"
          # Send failure notification to Slack/Teams
        fi
