<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Ninaivalaigal Admin Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-900">
    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold text-white">Nina Admin Console</h1>
                <nav class="flex space-x-4">
                    <a href="/admin/analytics" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">
                        Analytics
                    </a>
                    <a href="/admin/teams" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">
                        Teams
                    </a>
                    <a href="/admin/users" class="text-blue-400 hover:text-blue-300 px-3 py-2 rounded-md text-sm font-medium">
                        Users
                    </a>
                    <a href="/admin/logout" class="text-gray-400 hover:text-white px-3 py-2 rounded-md text-sm font-medium">
                        Logout
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-white mb-2">User Management</h2>
            <p class="text-gray-400">Monitor and manage all users on the platform</p>
        </div>

        <!-- Users Table -->
        <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
            <table class="min-w-full divide-y divide-gray-700">
                <thead class="bg-gray-750">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Email</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Teams</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Status</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Joined</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody id="users-table-body" class="divide-y divide-gray-700">
                    <!-- Users will be loaded here via JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        // Get admin token from cookie
        function getAdminToken() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'admin_token') {
                    return value;
                }
            }
            return null;
        }

        // Fetch users list
        async function fetchUsers() {
            const token = getAdminToken();
            if (!token) {
                window.location.href = '/admin/login';
                return;
            }

            try {
                // TODO: Replace with actual API endpoint when available
                // For now, use mock data
                const users = [
                    { id: '1', name: 'John Doe', email: 'john@example.com', teams: 2, status: 'Active', joined: '2024-01-15' },
                    { id: '2', name: 'Jane Smith', email: 'jane@example.com', teams: 1, status: 'Active', joined: '2024-02-20' },
                    { id: '3', name: 'Bob Johnson', email: 'bob@example.com', teams: 3, status: 'Inactive', joined: '2023-12-10' },
                ];

                const tbody = document.getElementById('users-table-body');
                tbody.innerHTML = users.map(user => `
                    <tr class="hover:bg-gray-750">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-white">${user.name}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">${user.email}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">${user.teams}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${user.status === 'Active' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'}">
                                ${user.status}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">${user.joined}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-blue-400 hover:text-blue-300 cursor-pointer">
                            View Details
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Failed to fetch users:', error);
            }
        }

        // Fetch users on page load
        fetchUsers();
    </script>
</body>
</html>
