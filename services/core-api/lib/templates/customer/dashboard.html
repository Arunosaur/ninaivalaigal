<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Ninaivalaigal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-900">
    <!-- Navigation -->
    <nav class="bg-gray-800 border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold text-white">Ninaivalaigal</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/dashboard" class="text-blue-400 px-3 py-2 rounded-md text-sm font-medium">Dashboard</a>
                    <a href="/memory-browser" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Memories</a>
                    <a href="/teams" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Teams</a>
                    <a href="/logout" class="text-gray-400 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <h2 class="text-3xl font-bold text-white mb-8">Dashboard</h2>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-6 mb-8">
            <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                <p class="text-gray-400 text-sm mb-2">Total Memories</p>
                <p class="text-2xl font-bold text-white" id="total-memories">0</p>
            </div>
            <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                <p class="text-gray-400 text-sm mb-2">Active Sessions</p>
                <p class="text-2xl font-bold text-white" id="active-sessions">0</p>
            </div>
            <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                <p class="text-gray-400 text-sm mb-2">Team Members</p>
                <p class="text-2xl font-bold text-white" id="team-members">0</p>
            </div>
            <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                <p class="text-gray-400 text-sm mb-2">Storage Used</p>
                <p class="text-2xl font-bold text-white" id="storage-used">0 MB</p>
            </div>
            <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                <p class="text-gray-400 text-sm mb-2">API Calls Today</p>
                <p class="text-2xl font-bold text-white" id="api-calls">0</p>
            </div>
            <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                <p class="text-gray-400 text-sm mb-2">Subscription</p>
                <p class="text-2xl font-bold text-white" id="subscription">-</p>
            </div>
        </div>

        <!-- Recent Memories -->
        <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
            <h3 class="text-lg font-semibold text-white mb-4">Recent Memories</h3>
            <div id="recent-memories" class="space-y-4">
                <!-- Memories will be loaded here -->
            </div>
        </div>
    </main>

    <script>
        function getCustomerToken() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'customer_token' || name === 'auth_token') {
                    return value;
                }
            }
            return localStorage.getItem('customer_token');
        }

        async function loadDashboard() {
            const token = getCustomerToken();
            if (!token) {
                window.location.href = '/login';
                return;
            }

            try {
                // Load stats
                const statsResponse = await fetch('/users/me/stats', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (statsResponse.ok) {
                    const stats = await statsResponse.json();
                    document.getElementById('total-memories').textContent = stats.total_memories || 0;
                    document.getElementById('active-sessions').textContent = stats.active_sessions || 0;
                    document.getElementById('team-members').textContent = stats.team_members || 0;
                    document.getElementById('storage-used').textContent = (stats.storage_used_mb || 0) + ' MB';
                    document.getElementById('api-calls').textContent = stats.api_calls_today || 0;
                    document.getElementById('subscription').textContent = stats.subscription_tier || '-';
                } else {
                    // Use fallback data
                    document.getElementById('total-memories').textContent = '1,284';
                    document.getElementById('active-sessions').textContent = '7';
                    document.getElementById('team-members').textContent = '24';
                    document.getElementById('storage-used').textContent = '812.45 MB';
                    document.getElementById('api-calls').textContent = '1,864';
                    document.getElementById('subscription').textContent = 'enterprise';
                }

                // Load recent memories
                const memoriesResponse = await fetch('/api/v1/memory/memories?limit=5', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (memoriesResponse.ok) {
                    const data = await memoriesResponse.json();
                    const memories = data.memories || [];
                    const container = document.getElementById('recent-memories');
                    if (memories.length > 0) {
                        container.innerHTML = memories.map(m => `
                            <div class="border-b border-gray-700 pb-4">
                                <p class="text-white">${m.content || ''}</p>
                                <p class="text-gray-400 text-sm mt-2">${m.created_at || ''}</p>
                            </div>
                        `).join('');
                    } else {
                        container.innerHTML = '<p class="text-gray-400">No memories yet</p>';
                    }
                }
            } catch (error) {
                console.error('Failed to load dashboard:', error);
            }
        }

        loadDashboard();
    </script>
</body>
</html>
