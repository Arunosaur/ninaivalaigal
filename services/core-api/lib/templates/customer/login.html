<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Ninaivalaigal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .brand-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <main id="main-content" class="bg-slate-800/50 backdrop-blur-xl rounded-2xl border border-white/10 p-8 shadow-2xl">
            <h1 class="text-center text-2xl font-semibold text-white">Log In</h1>
            <p class="text-center text-sm text-slate-400 mt-2">
                Access your exponential memory workspace
            </p>

            {% if error %}
            <div
                id="login-error"
                role="alert"
                aria-live="polite"
                class="mt-6 rounded-xl border border-rose-500/40 bg-rose-500/10 px-4 py-3 text-sm text-rose-200"
            >
                {{ error }}
            </div>
            {% endif %}

            <form
                id="login-form"
                class="mt-6 space-y-5"
                method="POST"
                action="/login"
                aria-label="Login form"
            >
                <div class="space-y-2">
                    <label
                        for="login-email"
                        class="block text-sm font-semibold uppercase tracking-[0.18em] text-slate-400"
                    >
                        Email
                    </label>
                    <input
                        type="email"
                        placeholder="you@example.com"
                        id="login-email"
                        name="email"
                        required
                        class="w-full rounded-xl border border-white/10 bg-slate-900/70 px-4 py-3 text-sm text-slate-100 placeholder:text-slate-500 focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/60"
                        autoComplete="email"
                        aria-required="true"
                        aria-label="Email address"
                    />
                </div>

                <div class="space-y-2">
                    <label
                        for="login-password"
                        class="block text-sm font-semibold uppercase tracking-[0.18em] text-slate-400"
                    >
                        Password
                    </label>
                    <input
                        type="password"
                        placeholder="••••••••"
                        id="login-password"
                        name="password"
                        required
                        class="w-full rounded-xl border border-white/10 bg-slate-900/70 px-4 py-3 text-sm text-slate-100 placeholder:text-slate-500 focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/60"
                        autoComplete="current-password"
                        aria-required="true"
                        aria-label="Password"
                    />
                </div>

                <button
                    type="submit"
                    id="submit-btn"
                    class="brand-gradient flex w-full items-center justify-center rounded-xl px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-600/30 transition hover:shadow-indigo-600/45 disabled:cursor-not-allowed disabled:opacity-70 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-900"
                    aria-label="Log in to your account"
                >
                    <span id="submit-text">Log In</span>
                    <span id="submit-loading" class="hidden">Signing in...</span>
                </button>
            </form>

            <p class="mt-6 text-center text-sm text-slate-400">
                Don't have an account?{' '}
                <a
                    href="/signup"
                    class="font-semibold text-slate-200 transition hover:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-900 rounded"
                    aria-label="Sign up for a new account"
                >
                    Sign up
                </a>
            </p>
        </main>
    </div>

    <script>
        // Handle form submission
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            const submitText = document.getElementById('submit-text');
            const submitLoading = document.getElementById('submit-loading');
            const errorDiv = document.getElementById('login-error');

            // Disable form
            submitBtn.disabled = true;
            submitText.classList.add('hidden');
            submitLoading.classList.remove('hidden');

            // Hide previous error
            if (errorDiv) {
                errorDiv.style.display = 'none';
            }

            const formData = new FormData(this);
            const email = formData.get('email');
            const password = formData.get('password');

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();

                if (response.ok && (data.access_token || data.jwt_token || data.token)) {
                    // Store token
                    const token = data.access_token || data.jwt_token || data.token;
                    if (token) {
                        localStorage.setItem('customer_token', token);
                    }
                    // Redirect to dashboard
                    window.location.href = '/dashboard';
                } else {
                    // Show error
                    const errorMessage = data.detail || 'Login failed. Please check your credentials.';
                    const newErrorDiv = document.createElement('div');
                    newErrorDiv.id = 'login-error';
                    newErrorDiv.role = 'alert';
                    newErrorDiv.setAttribute('aria-live', 'polite');
                    newErrorDiv.className = 'mt-6 rounded-xl border border-rose-500/40 bg-rose-500/10 px-4 py-3 text-sm text-rose-200';
                    newErrorDiv.textContent = errorMessage;

                    const form = document.getElementById('login-form');
                    form.parentNode.insertBefore(newErrorDiv, form);
                }
            } catch (error) {
                // Show error
                const newErrorDiv = document.createElement('div');
                newErrorDiv.id = 'login-error';
                newErrorDiv.role = 'alert';
                newErrorDiv.setAttribute('aria-live', 'polite');
                newErrorDiv.className = 'mt-6 rounded-xl border border-rose-500/40 bg-rose-500/10 px-4 py-3 text-sm text-rose-200';
                newErrorDiv.textContent = 'Login failed. Please check your credentials.';

                const form = document.getElementById('login-form');
                form.parentNode.insertBefore(newErrorDiv, form);
            } finally {
                // Re-enable form
                submitBtn.disabled = false;
                submitText.classList.remove('hidden');
                submitLoading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
