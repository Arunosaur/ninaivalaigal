version: '3.9'

services:
  api:
    build: .
    container_name: ninaivalaigal-dev-api
    env_file: .env
    ports:
      - "8000:8000"
    command: >
      sh -c "
      if [ \"$${ENV}\" = 'dev' ]; then
        uvicorn app.main:app --reload --host 0.0.0.0 --port 8000;
      else
        gunicorn app.main:app -k uvicorn.workers.UvicornWorker -c gunicorn.conf.py;
      fi
      "
