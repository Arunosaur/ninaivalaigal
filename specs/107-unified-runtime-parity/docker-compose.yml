version: '3.9'

services:
  api:
    build: .
    container_name: ninaivalaigal-dev-api
    env_file: .env
    ports:
      - "8000:8000"
    # SPEC-107: Use gunicorn for all environments via docker-entrypoint.sh
    # gunicorn.conf.py handles ENV-based worker count and reload automatically
    environment:
      ENV: ${ENV:-dev}  # dev/test/prod - used by gunicorn.conf.py
