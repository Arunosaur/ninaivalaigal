name: Deploy Customer App to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'frontend-nextjs-customer/**'
      - 'frontend-shared/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared library
        run: npm run build --workspace=frontend-shared

      - name: Lint & type-check
        run: |
          npm run lint --workspace=frontend-nextjs-customer
          npm run type-check --workspace=frontend-nextjs-customer

      - name: Run tests
        run: npm run test --workspace=frontend-nextjs-customer

      - name: Build customer app
        run: npm run build --workspace=frontend-nextjs-customer

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_CUSTOMER }}
          working-directory: frontend-nextjs-customer
          vercel-args: '--prod'
