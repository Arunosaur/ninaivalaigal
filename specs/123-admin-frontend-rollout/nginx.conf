server {
    listen 443 ssl http2;
    server_name admin.ninaivalaigal.internal;

    # SSL Configuration
    ssl_certificate /etc/ssl/certs/admin.ninaivalaigal.internal.crt;
    ssl_certificate_key /etc/ssl/private/admin.ninaivalaigal.internal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # IP Whitelist (VPN subnet + office IPs)
    allow 100.64.0.0/10;  # Tailscale CGNAT range
    allow 192.168.1.0/24; # Office network
    allow 10.0.0.0/8;     # Internal network
    deny all;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy to Next.js admin app
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Logs
    access_log /var/log/nginx/admin.ninaivalaigal.access.log;
    error_log /var/log/nginx/admin.ninaivalaigal.error.log;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name admin.ninaivalaigal.internal;
    return 301 https://$server_name$request_uri;
}
