plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '1.17.2'
    id 'jacoco'
}

group 'com.ninaivalaigal'
version '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.json:json:20230618'

    // Test dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.10"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/com/mem0/**',  // Exclude legacy mem0 files
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                minimum = 0.70  // 70% coverage target
            }
        }
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/com/mem0/**',  // Exclude legacy mem0 files
            ])
        }))
    }
}

// See https://github.com/JetBrains/gradle-intellij-plugin/
intellij {
    version = '2022.1'
    type = 'IC' // IntelliJ IDEA Community Edition
    plugins = ['com.intellij.java']
}

patchPluginXml {
    changeNotes = """
      Version 1.0.0 - Native Ninaivalaigal Integration:
      <ul>
        <li>Refactored from legacy mem0 to native ninaivalaigal</li>
        <li>Integrated with ninaivalaigal MCP server (stdio transport)</li>
        <li>Context management (start, list, switch contexts)</li>
        <li>Memory operations (remember, recall via MCP protocol)</li>
        <li>Project-based context auto-detection</li>
        <li>Configurable MCP server path in settings</li>
      </ul>
      """
}

signPlugin {
    certificateChain = System.getenv("CERTIFICATE_CHAIN")
    privateKey = System.getenv("PRIVATE_KEY")
    password = System.getenv("PRIVATE_KEY_PASSWORD")
}

publishPlugin {
    token = System.getenv("PUBLISH_TOKEN")
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}
