version: '3.8'

# Colima/Docker - Development Environment
# Optimized for M1/M2 Macs with native ARM performance
# Usage: COMPOSE_PROJECT_NAME=ninaivalaigal-colima docker-compose -f compose.apple.dev.yml up -d

services:
  postgres:
    image: postgres:15.8
    platform: linux/arm64
    container_name: ninaivalaigal-dev-db
    environment:
      POSTGRES_DB: ninaivalaigal_dev
      POSTGRES_USER: nina
      POSTGRES_PASSWORD: ${NINA_DB_PASSWORD:-secure_nina_password}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"  # Dev environment shared database
    volumes:
      - ./data/postgres_dev:/var/lib/postgresql/data  # Bind mount - shared with docker and colima
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nina -d ninaivalaigal_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ninaivalaigal_apple_dev_network

  redis:
    image: redis:7.4.0-alpine
    platform: linux/arm64
    container_name: ninaivalaigal-dev-redis
    ports:
      - "6389:6379"  # Colima/Dev port (+10 offset)
    environment:
      REDIS_PASSWORD: ${NINA_REDIS_PASSWORD:-secure_nina_password}
    command: redis-server --requirepass ${NINA_REDIS_PASSWORD:-secure_nina_password} --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - ./data/redis_dev:/data  # Bind mount - shared with docker and colima
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${NINA_REDIS_PASSWORD:-secure_nina_password}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ninaivalaigal_apple_dev_network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      platforms:
        - linux/arm64
    platform: linux/arm64
    container_name: ninaivalaigal-dev-api
    command: ["python", "run_server.py"]
    ports:
      - "13380:8000"  # Colima/Dev port (+10 offset)
    environment:
      NINAIVALAIGAL_DATABASE_URL: postgresql://nina:${NINA_DB_PASSWORD:-secure_nina_password}@postgres:5432/ninaivalaigal_dev
      NINAIVALAIGAL_JWT_SECRET: ${NINA_JWT_SECRET:-dev_jwt_secret}
      NINAIVALAIGAL_DEBUG: "1"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${NINA_REDIS_PASSWORD:-secure_nina_password}
      REDIS_DB: 0
      REDIS_URL: redis://:${NINA_REDIS_PASSWORD:-secure_nina_password}@redis:6379/0
      PYTHONPATH: /app/server
      PORT: 8000
      UVICORN_RELOAD: "0"
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app/server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - ninaivalaigal_apple_dev_network

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    platform: linux/arm64
    container_name: ninaivalaigal-dev-ui
    ports:
      - "8091:8081"  # Colima/Dev port (+10 offset)
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:13380
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - ninaivalaigal_apple_dev_network

# No volumes section needed - using bind mounts

networks:
  ninaivalaigal_apple_dev_network:
    driver: bridge
